<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-labelledby="t d">
<title id="t">Guide: power save and reboot through the BMC farm</title><desc id="d">A node going dark and coming back, with a BMC chip beside it.</desc>
<style>:root{--surface:#f4f8f7;--surface2:#e3ece9;--line:#9db3ae;--ink:#14211f;--muted:#44544f;--teal:#0b8f80;--amber:#b86e00;--red:#c0392b;--access:#1d7fd1;--control:#475569;--k8s:#4f6ad6;--data:#8a4fd6;--monitoring:#138a5a;--management:#b86e00}@media (prefers-color-scheme:dark){:root{--surface:#111b19;--surface2:#1b2a27;--line:#3a4e4a;--ink:#e5eeec;--muted:#a9bbb7;--teal:#2fc4b2;--amber:#f0a030;--red:#ff7b72;--access:#5CB8FF;--control:#E2E8F0;--k8s:#7C9CFF;--data:#C49BFF;--monitoring:#4BE3A0;--management:#FFB347}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.h{font-size:22px}.s{font-size:12px}.c{text-anchor:middle}.bg{fill:var(--surface)}.p2{fill:var(--surface2);stroke:var(--line)}.ln{stroke:var(--line);fill:none;stroke-width:2}.tx{fill:var(--ink)}.tm{fill:var(--muted)}.tx2{fill:var(--ink)}.tm2{fill:var(--muted)}.ok{fill:var(--teal)}.warn{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 5}.bad{fill:var(--red)}.mk{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rk{fill:var(--surface2);stroke:var(--ink);stroke-width:2}.gov{fill:#f0a030}.m{fill:var(--teal)}.i{fill:var(--ink)}.l{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:var(--amber);stroke-dasharray:7 6;stroke-linecap:round}.w-access{stroke:var(--access)}.w-control{stroke:var(--control)}.w-k8s{stroke:var(--k8s)}.w-data{stroke:var(--data)}.w-monitoring{stroke:var(--monitoring)}.w-management{stroke:var(--management)}.halo{fill:none;stroke-width:7;stroke-opacity:.18;stroke-linecap:round}.core{fill:none;stroke-width:2.5;stroke-linecap:round}.pulse{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 23}@keyframes flow{to{stroke-dashoffset:-48}}.pulse{animation:flow 2.4s linear infinite}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect class="bg" width="720" height="150" rx="16"/>
<text class="tx h b" x="24" y="34">Power and reboot</text><rect class="ok" x="60" y="62" width="26" height="26" rx="7"/><path class="mk" d="M67.0 75.0l4 4.5l8-9"/><path class="halo w-management" d="M96 75H180"/><path class="core w-management" d="M96 75H180"/><path class="pulse w-management" d="M96 75H180"/><rect class="bad" x="180" y="62" width="26" height="26" rx="7"/><path class="mk" d="M188.0 70.0l10 10M198.0 70.0l-10 10"/><path class="halo w-management" d="M216 75H300"/><path class="core w-management" d="M216 75H300"/><path class="pulse w-management" d="M216 75H300"/><rect class="ok" x="300" y="62" width="26" height="26" rx="7"/><path class="mk" d="M307.0 75.0l4 4.5l8-9"/><text class="tm s" x="60" y="124">power down, then power up, through the BMC</text>
</svg>
