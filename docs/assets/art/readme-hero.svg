<rect class="i" x="8" y="94" width="104" height="10" rx="3.5"/><rect class="i" x="18" y="104" width="9" height="12" rx="2"/><rect class="i" x="93" y="104" width="9" height="12" rx="2"/>
</g></g><text class="tx h b" x="280" y="76">workbench</text><text class="tx" x="280" y="104">A pretend HPC cluster for a 16 GB laptop,</text><text class="tm" x="280" y="126">with a bouncer that keeps it from eating all your RAM.</text><rect class="p2" x="24" y="270" width="672" height="130" rx="14"/><text class="tx2 s b" x="44" y="296">login</text><text class="tx2 s b" x="172" y="296">slurmctld</text><text class="tx2 s b" x="334" y="296">nodes</text><rect class="rk" x="40" y="318" width="64" height="44" rx="10"/><text class="tx2 s c" x="72" y="345">login</text><rect class="rk" x="168" y="318" width="84" height="44" rx="10"/><text class="tx2 s c" x="210" y="345">slurmctld</text><path class="halo w-access" d="M104 340H168"/><path class="core w-access" d="M104 340H168"/><path class="pulse w-access" d="M104 340H168"/><path class="halo w-access" d="M252 340H330"/><path class="core w-access" d="M252 340H330"/><path class="pulse w-access" d="M252 340H330"/><rect class="rk" x="330" y="327" width="148" height="46" rx="10"/><rect class="ok" x="340" y="337" width="26" height="26" rx="7"/><path class="mk" d="M347.0 350.0l4 4.5l8-9"/><rect class="ok" x="374" y="337" width="26" height="26" rx="7"/><path class="mk" d="M381.0 350.0l4 4.5l8-9"/><rect class="warn" x="408" y="337" width="26" height="26" rx="7"/><path class="ln" style="stroke:var(--amber);stroke-width:3" d="M417.5 344.0v12M424.5 344.0v12"/><rect class="ok" x="442" y="337" width="26" height="26" rx="7"/><path class="mk" d="M449.0 350.0l4 4.5l8-9"/><path class="ln" style="stroke-dasharray:5 4" d="M500 338a16 16 0 0 1 4-30a22 22 0 0 1 42-4a18 18 0 0 1 26 12a14 14 0 0 1-4 22z"/><text class="tx s c" x="538" y="329">mocks</text><rect class="gov" x="588" y="308" width="92" height="34" rx="17"/><text x="634" y="330" class="c b s" style="fill:#14211f">governor</text><text class="tm2 s" x="44" y="388">real Slurm in small containers; the APIs around it are stand-ins</text>
