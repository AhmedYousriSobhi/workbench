<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-labelledby="t d">
<title id="t">Chapter 7: the governor</title><desc id="d">The governor badge beside a ladder of four levels: normal, warn, pause and stop, with the marks growing more serious.</desc>
<style>:root{--surface:#f5f7f7;--surface2:#eef1f0;--line:#afb2b1;--ink:#1c2927;--muted:#4f5b59;--teal:#0b8f80;--amber:#b86e00;--red:#cf2d37;--access:#3695da;--control:#8a8f97;--k8s:#7689e4;--data:#a37adb;--monitoring:#6c9c29;--management:#d27092}@media (prefers-color-scheme:dark){:root{--surface:#061210;--surface2:#1c2927;--line:#4f5b59;--ink:#f5f7f7;--muted:#afb2b1;--teal:#2fc4b2;--amber:#f0a030;--red:#f55455;--access:#5cb8ff;--control:#e2e8f0;--k8s:#8ea2ff;--data:#c49bff;--monitoring:#a6d96a;--management:#f48fb1}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.h{font-size:22px}.s{font-size:12px}.c{text-anchor:middle}.bg{fill:var(--surface)}.p2{fill:var(--surface2);stroke:var(--line)}.ln{stroke:var(--line);fill:none;stroke-width:2}.tx{fill:var(--ink)}.tm{fill:var(--muted)}.tx2{fill:var(--ink)}.tm2{fill:var(--muted)}.ok{fill:var(--teal)}.warn{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 5}.bad{fill:var(--red)}.mk{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rk{fill:var(--surface2);stroke:var(--ink);stroke-width:2}.gov{fill:#f0a030}.m{fill:var(--teal)}.i{fill:var(--ink)}.l{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:var(--amber);stroke-dasharray:7 6;stroke-linecap:round}.w-access{stroke:var(--access)}.w-control{stroke:var(--control)}.w-k8s{stroke:var(--k8s)}.w-data{stroke:var(--data)}.w-monitoring{stroke:var(--monitoring)}.w-management{stroke:var(--management)}.halo{fill:none;stroke-width:7;stroke-opacity:.18;stroke-linecap:round}.core{fill:none;stroke-width:2.5;stroke-linecap:round}.pulse{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 23}@keyframes flow{to{stroke-dashoffset:-48}}.pulse{animation:flow 2.4s linear infinite}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
