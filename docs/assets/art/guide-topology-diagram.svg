<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
<title id="t">A leaf switch failing</title><desc id="d">A spine over two leaves; the second leaf is down and its three nodes are drained with a reason.</desc>
