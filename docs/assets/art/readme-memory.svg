<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
<title id="t">A 16 GB laptop's memory and the governor ladder</title><desc id="d">A memory bar split into the OS and desktop, your apps, the workbench with its min, std and full profiles, and the safety floor, above the governor's levels L0 to L4.</desc>
<style>:root{--surface:#f5f7f7;--surface2:#eef1f0;--line:#afb2b1;--ink:#1c2927;--muted:#4f5b59;--teal:#0b8f80;--amber:#b86e00;--red:#cf2d37;--access:#3695da;--control:#8a8f97;--k8s:#7689e4;--data:#a37adb;--monitoring:#6c9c29;--management:#d27092}@media (prefers-color-scheme:dark){:root{--surface:#061210;--surface2:#1c2927;--line:#4f5b59;--ink:#f5f7f7;--muted:#afb2b1;--teal:#2fc4b2;--amber:#f0a030;--red:#f55455;--access:#5cb8ff;--control:#e2e8f0;--k8s:#8ea2ff;--data:#c49bff;--monitoring:#a6d96a;--management:#f48fb1}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.h{font-size:22px}.s{font-size:12px}.c{text-anchor:middle}.bg{fill:var(--surface)}.p2{fill:var(--surface2);stroke:var(--line)}.ln{stroke:var(--line);fill:none;stroke-width:2}.tx{fill:var(--ink)}.tm{fill:var(--muted)}.tx2{fill:var(--ink)}.tm2{fill:var(--muted)}.ok{fill:var(--teal)}.warn{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 5}.bad{fill:var(--red)}.mk{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rk{fill:var(--surface2);stroke:var(--ink);stroke-width:2}.gov{fill:#f0a030}.m{fill:var(--teal)}.i{fill:var(--ink)}.l{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:var(--amber);stroke-dasharray:7 6;stroke-linecap:round}.w-access{stroke:var(--access)}.w-control{stroke:var(--control)}.w-k8s{stroke:var(--k8s)}.w-data{stroke:var(--data)}.w-monitoring{stroke:var(--monitoring)}.w-management{stroke:var(--management)}.halo{fill:none;stroke-width:7;stroke-opacity:.18;stroke-linecap:round}.core{fill:none;stroke-width:2.5;stroke-linecap:round}.pulse{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 23}</style>
<rect class="bg" width="720" height="350" rx="16"/>
<text class="tx h b" x="24" y="36">A 16 GB laptop, with room left</text><text class="tm s" x="24" y="56">Schematic, not to scale. Real numbers: docs/guides/memory.md</text><rect class="p2" x="24" y="74" width="174.7" height="44" rx="6"/><text class="tx s b c" x="111.36" y="140">OS + desktop</text><rect class="p2" x="198.72" y="74" width="174.7" height="44" rx="6"/><text class="tx s b c" x="286.08" y="140">your apps</text><rect class="ok" x="373.44" y="74" width="201.6" height="44" rx="6"/><text class="tx s b c" x="474.24" y="140">workbench</text><rect class="warn" x="577.04" y="76" width="117.0" height="40" rx="6"/><text class="tx s b c" x="635.52" y="140">safety floor</text><text class="tm s" x="373.44" y="174">workbench profiles</text><rect class="p2" x="373.44" y="184" width="66" height="30" rx="15"/><text class="tx2 s mono c" x="406.44" y="204">min</text><rect class="p2" x="447.44" y="184" width="66" height="30" rx="15"/><text class="tx2 s mono c" x="480.44" y="204">std</text><rect class="p2" x="521.44" y="184" width="66" height="30" rx="15"/><text class="tx2 s mono c" x="554.44" y="204">full</text><text class="tx b" x="24" y="244">The governor reacts as free memory shrinks</text><rect class="p2" x="24" y="258" width="124" height="30" rx="15"/><text class="tx2 s mono c" x="86.0" y="278">L0 normal</text><rect class="p2" x="159" y="258" width="124" height="30" rx="15"/><text class="tx2 s mono c" x="221.0" y="278">L1 warn</text><rect class="p2" x="294" y="258" width="124" height="30" rx="15"/><text class="tx2 s mono c" x="356.0" y="278">L2 throttle</text><rect class="p2" x="429" y="258" width="124" height="30" rx="15"/><text class="tx2 s mono c" x="491.0" y="278">L3 freeze</text><rect class="p2" x="564" y="258" width="124" height="30" rx="15"/><text class="tx2 s mono c" x="626.0" y="278">L4 stop</text><path class="ln" d="M24 306L690 306"/><path class="ln" d="M681 299L690 306L681 313"/><text class="tm s" x="24" y="328">Thresholds and dwell times: docs/architecture/05-governor.md</text>
</svg>
