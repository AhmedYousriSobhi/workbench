<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" role="img" aria-labelledby="t d">
<title id="t">How a workbench selection is built</title><desc id="d">A selection becomes an effective sim, then a plan, then governor admission, then a start.</desc>
<style>:root{--surface:#f4f8f7;--surface2:#e3ece9;--line:#9db3ae;--ink:#14211f;--muted:#44544f;--teal:#0b8f80;--amber:#b86e00;--red:#c0392b;--access:#1d7fd1;--control:#475569;--k8s:#4f6ad6;--data:#8a4fd6;--monitoring:#138a5a;--management:#b86e00}@media (prefers-color-scheme:dark){:root{--surface:#111b19;--surface2:#1b2a27;--line:#3a4e4a;--ink:#e5eeec;--muted:#a9bbb7;--teal:#2fc4b2;--amber:#f0a030;--red:#ff7b72;--access:#5CB8FF;--control:#E2E8F0;--k8s:#7C9CFF;--data:#C49BFF;--monitoring:#4BE3A0;--management:#FFB347}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.h{font-size:22px}.s{font-size:12px}.c{text-anchor:middle}.bg{fill:var(--surface)}.p2{fill:var(--surface2);stroke:var(--line)}.ln{stroke:var(--line);fill:none;stroke-width:2}.tx{fill:var(--ink)}.tm{fill:var(--muted)}.tx2{fill:var(--ink)}.tm2{fill:var(--muted)}.ok{fill:var(--teal)}.warn{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 5}.bad{fill:var(--red)}.mk{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rk{fill:var(--surface2);stroke:var(--ink);stroke-width:2}.gov{fill:#f0a030}.m{fill:var(--teal)}.i{fill:var(--ink)}.l{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:var(--amber);stroke-dasharray:7 6;stroke-linecap:round}.w-access{stroke:var(--access)}.w-control{stroke:var(--control)}.w-k8s{stroke:var(--k8s)}.w-data{stroke:var(--data)}.w-monitoring{stroke:var(--monitoring)}.w-management{stroke:var(--management)}.halo{fill:none;stroke-width:7;stroke-opacity:.18;stroke-linecap:round}.core{fill:none;stroke-width:2.5;stroke-linecap:round}.pulse{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 23}</style>
<rect class="bg" width="720" height="176" rx="16"/>
<text class="tx h b" x="24" y="34">From a wish to a running cluster</text><rect class="p2" x="24" y="64" width="150" height="30" rx="15"/><text class="tx2 s mono c" x="99.0" y="84">flags or bench.yaml</text><path class="halo w-access" d="M174 79H220"/><path class="core w-access" d="M174 79H220"/><rect class="p2" x="220" y="64" width="130" height="30" rx="15"/><text class="tx2 s mono c" x="285.0" y="84">effective sim</text><path class="halo w-access" d="M350 79H396"/><path class="core w-access" d="M350 79H396"/><rect class="p2" x="396" y="64" width="110" height="30" rx="15"/><text class="tx2 s mono c" x="451.0" y="84">plan</text><path class="halo w-access" d="M506 79H540"/><path class="core w-access" d="M506 79H540"/><rect class="p2" x="540" y="64" width="156" height="30" rx="15"/><text class="tx2 s c" x="618.0" y="84">governor admits</text><text class="tm s" x="24" y="128">the same effective sim feeds slurm.conf, the BMC farm, GPU metrics, get, describe and export</text><text class="tm s" x="24" y="150">plan changes nothing and exits 1 when it does not fit</text>
</svg>
