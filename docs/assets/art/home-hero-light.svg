<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-labelledby="t d">
<title id="t">workbench: a cluster under watch</title><desc id="d">The workbench emblem, a screen with a heartbeat line over six nodes, one held back by the governor, beside the name, one line on what it is for, and the parts it simulates: Slurm, Redfish BMCs, GPU metrics, Grafana, Jira and Kubernetes.</desc>
<style>:root{--surface:#f5f7f7;--surface2:#eef1f0;--line:#afb2b1;--ink:#1c2927;--muted:#4f5b59;--teal:#0b8f80;--amber:#b86e00;--red:#cf2d37;--access:#3695da;--control:#8a8f97;--k8s:#7689e4;--data:#a37adb;--monitoring:#6c9c29;--management:#d27092}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.h{font-size:22px}.s{font-size:12px}.c{text-anchor:middle}.bg{fill:var(--surface)}.p2{fill:var(--surface2);stroke:var(--line)}.ln{stroke:var(--line);fill:none;stroke-width:2}.tx{fill:var(--ink)}.tm{fill:var(--muted)}.tx2{fill:var(--ink)}.tm2{fill:var(--muted)}.ok{fill:var(--teal)}.warn{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 5}.bad{fill:var(--red)}.mk{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rk{fill:var(--surface2);stroke:var(--ink);stroke-width:2}.gov{fill:#f0a030}.m{fill:var(--teal)}.i{fill:var(--ink)}.l{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:var(--amber);stroke-dasharray:7 6;stroke-linecap:round}.w-access{stroke:var(--access)}.w-control{stroke:var(--control)}.w-k8s{stroke:var(--k8s)}.w-data{stroke:var(--data)}.w-monitoring{stroke:var(--monitoring)}.w-management{stroke:var(--management)}.halo{fill:none;stroke-width:7;stroke-opacity:.18;stroke-linecap:round}.core{fill:none;stroke-width:2.5;stroke-linecap:round}.pulse{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 23}.st{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sb{fill:none;stroke:var(--teal);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.fr{fill:var(--surface2);stroke:var(--ink);stroke-width:2.5}</style>
<rect class="bg" width="720" height="196" rx="16"/>
<g transform="translate(28 30) scale(1.0)"><rect class="fr" x="8" y="8" width="128" height="128" rx="22"/><path class="sb" d="M20 40h31.2l10.4 -14.0l10.4 28.0l10.4 -22.4l6.2 8.4h35.4"/><rect class="ok" x="26" y="66" width="26" height="26" rx="7"/><path class="mk" d="M33.0 79.0l4 4.5l8-9"/><rect class="ok" x="60" y="66" width="26" height="26" rx="7"/><path class="mk" d="M67.0 79.0l4 4.5l8-9"/><rect class="warn" x="94" y="66" width="26" height="26" rx="7"/><path class="ln" style="stroke:var(--amber);stroke-width:3" d="M103.5 73.0v12M110.5 73.0v12"/><rect class="ok" x="26" y="100" width="26" height="26" rx="7"/><path class="mk" d="M33.0 113.0l4 4.5l8-9"/><rect class="ok" x="60" y="100" width="26" height="26" rx="7"/><path class="mk" d="M67.0 113.0l4 4.5l8-9"/><rect class="ok" x="94" y="100" width="26" height="26" rx="7"/><path class="mk" d="M101.0 113.0l4 4.5l8-9"/></g><text class="tx h b" x="200" y="66">workbench</text><text class="tx" x="200" y="94">A simulated HPC and AI cluster for testing monitoring software.</text><text class="tm" x="200" y="116">Real Slurm, faithful stand-ins, faults on demand, on one 16 GB machine.</text><rect class="p2" x="200" y="136" width="51.0" height="30" rx="15"/><text class="tx2 s c" x="225.5" y="156">Slurm</text><rect class="p2" x="259.0" y="136" width="102.80000000000001" height="30" rx="15"/><text class="tx2 s c" x="310.4" y="156">Redfish BMCs</text><rect class="p2" x="369.8" y="136" width="95.4" height="30" rx="15"/><text class="tx2 s c" x="417.5" y="156">GPU metrics</text><rect class="p2" x="473.20000000000005" y="136" width="65.80000000000001" height="30" rx="15"/><text class="tx2 s c" x="506.1" y="156">Grafana</text><rect class="p2" x="547.0" y="136" width="43.6" height="30" rx="15"/><text class="tx2 s c" x="568.8" y="156">Jira</text><rect class="p2" x="598.6" y="136" width="88.0" height="30" rx="15"/><text class="tx2 s c" x="642.6" y="156">Kubernetes</text>
