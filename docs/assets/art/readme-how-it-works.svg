<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" role="img" aria-labelledby="t d">
<title id="t">How workbench works, in four panels</title><desc id="d">Four panels: mocks fake the APIs your app calls, real Slurm runs in small containers, the governor sits outside everything it may pause, and faults are named scenarios.</desc>
<style>:root{--surface:#f5f7f7;--surface2:#eef1f0;--line:#afb2b1;--ink:#1c2927;--muted:#4f5b59;--teal:#0b8f80;--amber:#b86e00;--red:#cf2d37;--access:#3695da;--control:#8a8f97;--k8s:#7689e4;--data:#a37adb;--monitoring:#6c9c29;--management:#d27092}@media (prefers-color-scheme:dark){:root{--surface:#061210;--surface2:#1c2927;--line:#4f5b59;--ink:#f5f7f7;--muted:#afb2b1;--teal:#2fc4b2;--amber:#f0a030;--red:#f55455;--access:#5cb8ff;--control:#e2e8f0;--k8s:#8ea2ff;--data:#c49bff;--monitoring:#a6d96a;--management:#f48fb1}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.b{font-weight:700}.h{font-size:22px}.s{font-size:12px}.c{text-anchor:middle}.bg{fill:var(--surface)}.p2{fill:var(--surface2);stroke:var(--line)}.ln{stroke:var(--line);fill:none;stroke-width:2}.tx{fill:var(--ink)}.tm{fill:var(--muted)}.tx2{fill:var(--ink)}.tm2{fill:var(--muted)}.ok{fill:var(--teal)}.warn{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:6 5}.bad{fill:var(--red)}.mk{fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.rk{fill:var(--surface2);stroke:var(--ink);stroke-width:2}.gov{fill:#f0a030}.m{fill:var(--teal)}.i{fill:var(--ink)}.l{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:var(--amber);stroke-dasharray:7 6;stroke-linecap:round}.w-access{stroke:var(--access)}.w-control{stroke:var(--control)}.w-k8s{stroke:var(--k8s)}.w-data{stroke:var(--data)}.w-monitoring{stroke:var(--monitoring)}.w-management{stroke:var(--management)}.halo{fill:none;stroke-width:7;stroke-opacity:.18;stroke-linecap:round}.core{fill:none;stroke-width:2.5;stroke-linecap:round}.pulse{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 23}@keyframes flow{to{stroke-dashoffset:-48}}.pulse{animation:flow 2.4s linear infinite}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect class="bg" width="720" height="258" rx="16"/>
<rect class="p2" x="24" y="24" width="160" height="196" rx="14"/><text class="tx2 b" x="36" y="52">1  Fake the APIs</text><text class="tm2 s" x="36" y="72">Jira, BMC, BCM, GPUs</text><path class="ln" style="stroke-dasharray:5 4" d="M60 138a16 16 0 0 1 4-30a22 22 0 0 1 42-4a18 18 0 0 1 26 12a14 14 0 0 1-4 22z"/><text class="tx s c" x="98" y="129">mocks</text><path class="ln" d="M104.0 148L104.0 174"/><path class="ln" d="M95.0 167L104.0 174L95.0 181"/><rect class="p2" x="44" y="176" width="120" height="30" rx="15"/><text class="tx2 s c" x="104.0" y="196">your app</text><rect class="p2" x="194" y="24" width="160" height="196" rx="14"/><text class="tx2 b" x="206" y="52">2  Real Slurm</text><text class="tm2 s" x="206" y="72">small containers</text><rect class="rk" x="208" y="110" width="108" height="44" rx="10"/><rect class="ok" x="218" y="120" width="24" height="24" rx="7"/><path class="mk" d="M224.0 132.0l4 4.5l8-9"/><rect class="ok" x="250" y="120" width="24" height="24" rx="7"/><path class="mk" d="M256.0 132.0l4 4.5l8-9"/><rect class="ok" x="282" y="120" width="24" height="24" rx="7"/><path class="mk" d="M288.0 132.0l4 4.5l8-9"/><text class="tx2 s c" x="274.0" y="174">slurmctld + slurmd</text><text class="tm2 s c" x="274.0" y="194">built from source</text><rect class="p2" x="364" y="24" width="160" height="196" rx="14"/><text class="tx2 b" x="376" y="52">3  The governor</text><text class="tm2 s" x="376" y="72">outside everything</text><rect class="gov" x="398" y="100" width="92" height="34" rx="17"/><text x="444" y="122" class="c b s" style="fill:#14211f">governor</text><rect class="rk" x="378" y="144" width="108" height="44" rx="10"/><rect class="ok" x="388" y="154" width="24" height="24" rx="7"/><path class="mk" d="M394.0 166.0l4 4.5l8-9"/><rect class="warn" x="420" y="154" width="24" height="24" rx="7"/><path class="ln" style="stroke:var(--amber);stroke-width:3" d="M428.5 160.0v12M435.5 160.0v12"/><rect class="ok" x="452" y="154" width="24" height="24" rx="7"/><path class="mk" d="M458.0 166.0l4 4.5l8-9"/><text class="tm2 s c" x="444.0" y="202">pauses before it stops</text><rect class="p2" x="534" y="24" width="160" height="196" rx="14"/><text class="tx2 b" x="546" y="52">4  Faults are stunts</text><text class="tm2 s" x="546" y="72">named, repeatable</text><rect class="p2" x="554" y="100" width="120" height="30" rx="15"/><text class="tx2 s mono c" x="614.0" y="120">gpu-xid-storm</text><path class="ln" d="M614.0 134L614.0 154"/><path class="ln" d="M605.0 147L614.0 154L605.0 161"/><rect class="rk" x="558" y="152" width="102" height="42" rx="10"/><rect class="ok" x="568" y="162" width="22" height="22" rx="7"/><path class="mk" d="M573.0 173.0l4 4.5l8-9"/><rect class="bad" x="598" y="162" width="22" height="22" rx="7"/><path class="mk" d="M604.0 168.0l10 10M614.0 168.0l-10 10"/><rect class="ok" x="628" y="162" width="22" height="22" rx="7"/><path class="mk" d="M633.0 173.0l4 4.5l8-9"/><text class="tm2 s c" x="614.0" y="202">a node down, then healed</text><path class="halo w-access" d="M24 240H696"/><path class="core w-access" d="M24 240H696"/><path class="pulse w-access" d="M24 240H696"/>
</svg>
