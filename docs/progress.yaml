# Single source of truth for docs/PROGRESS.md and docs/progress.html.
# Regenerate with: python -m simctl.progress   (validate.sh fails if the outputs are stale)
# status: done = merged and verified | review = in an open PR | partial = some of it works | todo = not started
# `where` paths are checked to exist for done/partial items.
updated: 2026-10-29
repo: https://github.com/AhmedYousriSobhi/opti-sim

phases:
  - id: p0
    title: Baseline
    goal: Measure real memory so budgets stop being guesses
    items:
      - {name: Measurement tooling, status: done, pr: 28, where: simctl/measure.py,
         how: "`simctl measure run/report` samples host, Docker containers, PSS per process and libvirt domains (read-only), saves JSON, suggests budgets = peak x 1.2."}
      - {name: Host baseline, status: partial,
         how: "Idle host and a small Slurm stack were measured (slurmd 5 MiB, slurmctld 13, MariaDB 171). No loaded run with mocks yet."}
      - {name: Budgets replaced by measured values, status: partial, pr: 68, where: profiles/min.yaml,
         how: "min measured live (VMs off, 60 queued jobs): 0.17 GB peak across containers, budget set to 1 GB. std/full are still estimates."}

  - id: p1
    title: Governor
    goal: A root service that keeps the host alive by escalating through a ladder
    items:
      - {name: Signals and escalation ladder, status: done, pr: 14, where: "governor/signals.py, governor/ladder.py",
         how: "MemAvailable, PSI and swap rate feed levels L0-L5. Escalates at once, steps down one level per 60 s calm with a 10 s dwell."}
      - {name: Priority planner, status: done, pr: 14, where: governor/planner.py,
         how: "P0-P6 classes; lowest priority first, reversible actions before destructive ones; undo on de-escalation."}
      - {name: Executors, status: done, pr: 20, where: governor/executors.py,
         how: "freeze, throttle (memory.high), reclaim, stop (cgroup.kill then docker stop), managedsave for VMs, via cgroup files opened in advance."}
      - {name: mlockall and pre-allocated mitigation path, status: done, pr: 19, where: governor/memlock.py,
         how: "Locks its own pages and pre-opens handles and buffers so L3/L4 performs no allocation (SPEC GV-8)."}
      - {name: Control socket, status: done, pr: 19, where: governor/control.py,
         how: "JSON lines on /run/hpcsim/gov.sock with a fixed allow-list; unknown commands are rejected."}
      - {name: NF-1 memory-hog test, status: done, pr: 24, where: tests/real/test_root.py,
         how: "A real container hog is throttled, frozen then stopped in order; no host OOM. Runs as root via scripts/real-test-root.sh."}
      - {name: Security watchdog, status: done, pr: 34, where: governor/watchdog.py,
         how: "Every 15 s flags privileged/capability/unconfined/host-namespace/docker.sock containers, missing limits and live memory.max drift. Report only; skipped from L3 up."}
      - {name: Monitored slurmrestd exception, status: done, pr: 44, where: governor/watchdog.py,
         how: "slurmrestd runs with two unshare steps disabled (ADR 0004). Any wider SLURMRESTD_SECURITY option is a violation; doctor lists the accepted exception."}
      - {name: Inventory refresh and Grafana annotations, status: done, pr: 36, where: "governor/annotate.py, governor/core.py",
         how: "Re-discovers containers so late starters are governed; posts audit events to Grafana with a token from the environment (SPEC GV-6)."}
      - {name: systemd unit installed permanently, status: partial, where: systemd,
         how: "Unit and slice pass systemd-analyze and ran as a transient service in tests; scripts/install-governor.sh installs it as the standing service (printed unit tested; the sudo install itself is run by the user)."}
      - {name: Admission and real scale / set-profile, status: done, pr: 48, where: governor/core.py,
         how: "admit command (GV-9): refused at L2+ or if it would breach the floor; scale and set-profile run simctl in the background at L0-L1 only (GV-8). simctl up/scale ask first. Verified live through the socket."}
      - {name: Governor /metrics endpoint, status: done, pr: 60, where: governor/metrics.py,
         how: "Prometheus text (level, MemAvailable, PSI, swap, groups per priority, actions, admissions) bound to the docker bridge address, rendered once per step so a scrape does no work (GV-8). The Prometheus 'governor' target is up on the live stack."}
      - {name: Live ladder test on the real stack, status: done, pr: 60, where: tests/real/test_pressure_real.py,
         how: "Dry-run governor against the running containers: L0 to L3 and back, /metrics, Grafana annotations and the planned throttle/freeze/thaw actions. The root variant passes on the dev machine: L3 really freezes a live container's cgroup (cgroup.events frozen 1), keeps P1 services running, and thaws on recovery; it also exposed and fixed the nested-slice cgroup path bug (PR 64)."}
      - {name: Host tuning script and simctl top, status: todo,
         how: "zram, swappiness and THP tuning with confirmation, and a live view of the governor."}

  - id: p2
    title: Slurm
    goal: A real scheduler the app can read, built from sim.yaml
    items:
      - {name: Slurm 26.05.5 images, status: done, pr: 32, where: images/node-base/Dockerfile,
         how: "Built from the SchedMD tarball (pinned and SHA256-checked) because Ubuntu's 23.11 lacks the 2026 security fixes; no extra container privileges (ADR 0002)."}
      - {name: Generated Slurm config, status: done, pr: 32, where: simctl/slurmconf.py,
         how: "slurm.conf, gres.conf and cgroup.conf derive from sim.yaml so node names match everywhere; fake GPUs use /dev/null-backed device files."}
      - {name: Compose generation, status: done, pr: 30, where: simctl/compose.py,
         how: "`simctl compose --profile X` renders services with mem_limit, cgroup_parent and the hpcsim.class label from sim.yaml and profiles."}
      - {name: slurmrestd with JWT, status: done, pr: 38, where: simctl/compose.py,
         how: "JWT-only REST on the internal network, own user, no privileges; skips two unshare steps instead of loosening seccomp (ADR 0003, ADR 0004). Verified live: no token 401, bad tokens get no data."}
      - {name: Accounting, status: done, pr: 38, where: simctl/slurmconf.py,
         how: "MariaDB on a capped tmpfs plus slurmdbd; sacctmgr bootstrap creates cluster, QOS and users from sim.yaml; secrets stay in a gitignored folder. Verified live: a job as alice appears in sacct and the REST slurmdb endpoint."}
      - {name: simctl up / down / scale, status: done, pr: 45, where: simctl/stack.py,
         how: "Pre-flight, staged start (observability, slurm, nodes), skips unbuilt mocks, scale regenerates slurm.conf, Grafana token created once (0600). Verified live with min; scale really stops containers."}

  - id: p3
    title: Mocks
    goal: Fake BMC, BCM and Jira so the app's integrations can be exercised
    items:
      - {name: gpu-exporter-farm, status: done, where: components/gpu-exporter-farm/exporter.py,
         how: "One process serving fake DCGM metrics for every simulated GPU, with fault injection over /sim/inject."}
      - {name: bmc-farm, status: done, pr: 52, where: components/bmc-farm/bmc.py,
         how: "One process serves /<node>/redfish/v1 for every node: Systems, Chassis Thermal/Power, Managers, event log, Reset action, POST /sim/inject (temp, fans, power, events). Verified live in the stack."}
      - {name: bcm-mock, status: partial, pr: 71, where: components/bcm-mock/bcm.py,
         how: "CMDaemon-style POST /json (cmdevice, cmstatus, cmpart) over the sim.yaml nodes, power calls and /sim/inject. Call names are an assumed subset (ADR 0005); verified live, 12 MiB."}
      - {name: jira-mock, status: partial, pr: 71, where: components/jira-mock/jira.py,
         how: "Mode mock only: REST v2/v3 issues, comments, workflow transitions with required-field errors, JQL subset, webhooks, 429/503/slow failures (ADR 0005). Verified live in the container (transitions, JQL, webhook to an outside receiver, 429/503), 15 MiB. cloud/dc modes not built."}
      - {name: Teleport access, status: todo, how: "Issue 77: the app reaches nodes through Teleport (auth + proxy, node access, outage and cert-expiry scenarios). Needs open decisions 6 first; will need sshd in node-base and a Phase 0 budget."}

  - id: p4
    title: People and chaos
    goal: Simulated users and engineers, scripted faults
    items:
      - {name: Scenario files, status: partial, where: scenarios, pr: 73,
         how: "Seven scenarios: gpu-xid-storm, node-down, fan-failure, jira-429, jira-outage run now; pod-crashloop and k8s-node-notready need k3d/KWOK."}
      - {name: user-sim and ticket-bot, status: todo, how: "Personas with Poisson arrivals and engineers working tickets."}
      - {name: scenario-engine, status: partial, pr: 73, where: simctl/scenario.py,
         how: "`simctl scenario list|run NAME [--speed N] [--dry-run]`: steps drive bmc-farm, bcm-mock, gpu-exporter, jira-mock and Slurm (scontrol); ramps; expect (slurm.node_state, jira.issue_created) watched from the start; k8s and ticket-bot steps skipped. Runs in the host CLI, not a container (ADR 0006). Verified live."}

  - id: p5
    title: Kubernetes
    goal: Mixed real and fake K8s nodes
    items:
      - {name: Cluster fixtures, status: done, where: k8s/fixtures,
         how: "Namespaces, workloads, failure signals and a read-only RBAC role, applied with apply.sh."}
      - {name: k3d plus KWOK cluster, status: partial,
         how: "Design is set but kubectl and k3d are not installed on this host, so it has not been brought up."}

  - id: p6
    title: Fidelity VM
    goal: One real Ubuntu VM with Redfish power control
    items:
      - {name: VM scaffold, status: partial, where: fidelity-vm,
         how: "Vagrantfile, provisioning scripts and up/down helpers exist; not re-verified end to end since the scaffold merge."}

  - id: p7
    title: Web UI and profiles
    goal: One click from cold start to a busy cluster
    items:
      - {name: Profile pre-flight (CLI), status: done, pr: 26, where: simctl/checks.py,
         how: "`simctl preflight` refuses a profile when free memory minus its budget is under the safety floor and suggests a smaller one."}
      - {name: Web UI base, status: partial, pr: 76, where: webui/,
         how: "`python -m webui` on 127.0.0.1:8088 with a login token: Governor dashboard (level banner, MemAvailable/PSI sparklines, audit log over SSE) and Scenario Orchestrator (list, Play with speed, Stop, per-step timeline). Reads the governor socket only; Slurm steps are skipped in the UI. ~32 MB RSS on Starlette (ADR 0008). Reviewed in headless Chromium (desktop/phone, light/dark; no console errors or overflow; ARIA tabs, keyboard, status not by colour alone)."}
      - {name: Cluster Canvas, status: partial, pr: 84, where: "webui/cluster.py, webui/static/index.html",
         how: "Cluster tab: service reachability chips and a card per sim.yaml node (power, CPU temp, fans, BCM state, GPU XID) refreshed every 3 s, with Power off/on, Overheat, Fan failure, GPU error and Clear actions that go through the mocks. Slurm drain and K8s faults are not offered (UI has no Docker access; K8s not built). Verified live."}
      - {name: App shell and layout, status: review, pr: 91, where: webui/static/index.html,
         how: "One dashboard page: cluster components in the middle (service chips, traffic dots, node cards), governor in the left panel, needs-attention, scenarios and log in the right panel; panels stack on small screens. A status strip on top (governor level, memory, services, nodes, running scenario, theme), a calm palette with a soft level banner and area sparklines, light/dark/auto theme, skip link and landmarks, 4 px spacing scale. Based on dashboard and navigation guidance from Splunk, Zuora, Grafana and SaaS UX guides (issue 90)."}
      - {name: Animated workload dots, status: review, pr: 89, where: "webui/flow.py, components/*/ (GET /sim/stats), webui/static/index.html",
         how: "Cluster tab Traffic panel: a dot travels from Clients to a mock each time it serves a real request (the mocks count them at /sim/stats; health checks, /sim calls and the UI's own polls are excluded), a diamond from Fault injector when a fault is applied. SSE at /api/flow opened only while the tab shows; pause button; stops at governor L3+ and for reduced motion. Slurm job dots are not drawn (the UI cannot read the scheduler). ADR 0009."}
      - {name: Budget manager, status: todo, how: "Profile/budget form (W-7)."}

  - id: p8
    title: macOS agent and CI
    goal: External Mac agent and unattended scenario runs
    items:
      - {name: Mac agent profile and headless CI, status: todo, how: "External agent only (licence); scenario suite with assertions."}

  - id: x
    title: Platform and tooling
    goal: What keeps every change safe and debuggable
    items:
      - {name: validate.sh gate, status: done, pr: 18, where: scripts/validate.sh,
         how: "Secrets scan, compile, ruff, shellcheck, YAML/JSON, systemd verify, pytest and a governor smoke run before every commit."}
      - {name: Public-repo privacy guard and git hooks, status: review, where: "scripts/check-privacy.sh, .githooks/, scripts/install-hooks.sh, SECURITY.md",
         how: "check-privacy.sh blocks home paths, the local username, personal emails, tokens and keys, local-only paths (.claude/, graphify-out/) and symlinks that leave the repo, and prints only file:line and the rule. Tracked hooks: pre-commit (no commits on main/dev, privacy, validate.sh), commit-msg (issue reference), pre-push (no push to main/dev, full scan); installed by install-hooks.sh. validate.sh runs the scan too. Issue 104."}
      - {name: Unit-test coverage gate, status: done, pr: 81, where: "tests/, scripts/validate.sh",
         how: "validate.sh runs the unit tests under coverage and fails below 90% (override COV_FLOOR). 226 tests, 98% of simctl, governor, webui and components. Not covered by unit tests, by design: code that needs root, a live Docker stack or a browser (tests/real)."}
      - {name: Real-host tests, status: done, pr: [20, 22], where: "scripts/real-test.sh, scripts/real-test-root.sh",
         how: "User-level tests with cgroups, Docker, libvirt and a live governor; a sudo suite for root-only paths."}
      - {name: Rootless governor (no sudo), status: review, pr: 98, where: "governor/executors.py, scripts/opti, simctl/checks.py",
         how: "`python -m governor --user-mode` pauses/stops containers through the Docker API, skips memory.high throttle and reclaim, keeps the ladder, admission, watchdog and metrics, listens under $XDG_RUNTIME_DIR. `opti start` runs it when no system service is up. Live-tested: freeze/thaw of a real container, no sudo called. ADR 0010."}
      - {name: One-command launcher, status: review, pr: 95, where: scripts/opti,
         how: "`./scripts/opti start` runs the machine check, creates the venv if missing, notes whether the governor is installed, brings the cluster up and starts the web page in the background, then prints the login link; `stop`, `status`, `open`. Idempotent. Live-tested start, second start, stop."}
      - {name: Initial machine check, status: review, pr: 87, where: "simctl/machine.py, scripts/check-machine.sh",
         how: "`./scripts/check-machine.sh` (system python3 only, runs before any build) checks OS, cores, RAM, disk, cgroup v2, Docker daemon and compose, free ports, optional tools, and which profiles fit; READY or NOT READY with a fix per problem. Also `simctl check`."}
      - {name: simctl doctor / status / diag, status: done, pr: 26, where: "simctl/checks.py, simctl/diag.py",
         how: "Environment checks with fixes, governor state, a masked diagnostics tarball, and the container security check."}
      - {name: Observability stack, status: done, where: compose/observability.yml,
         how: "Prometheus (2 d, tmpfs), Grafana with provisioned dashboard, fake GPU exporter."}
      - {name: Decisions as ADRs, status: done, where: docs/adr,
         how: "0001 record decisions, 0002 Slurm from source with no extra privileges, 0003 slurmrestd/JWT and accounting, 0004 slurmrestd keeps its unshare steps disabled."}
      - {name: Getting-started guide, status: done, pr: 52, where: docs/guides/getting-started.md,
         how: "Step-by-step use of the app; tests/test_docs.py fails if a documented command disappears."}
      - {name: Verification helpers, status: done, pr: 48, where: scripts/verify.sh,
         how: "verify.sh runs validate.sh plus real tests (--full adds the live stack lifecycle); tests/real/helpers.py starts a live governor and talks to its socket."}
      - {name: Progress tracker, status: done, pr: 42, where: simctl/progress.py,
         how: "This page, generated from docs/progress.yaml (issue 41)."}

architecture:
  groups:
    - {id: host, title: "Host (root, outside every container)"}
    - {id: net, title: "Docker network (sim containers, no privileges)"}
    - {id: ext, title: "Outside the 16 GB budget"}
  nodes:
    - {id: simctl, group: host, label: "simctl CLI", status: partial}
    - {id: gov, group: host, label: "Governor (ladder + watchdog)", status: done}
    - {id: sock, group: host, label: "gov.sock", status: done}
    - {id: docker, group: host, label: "Docker + cgroups", status: done}
    - {id: libvirt, group: host, label: "libvirt VMs", status: partial}
    - {id: ctld, group: net, label: "slurmctld", status: done}
    - {id: slurmd, group: net, label: "slurmd x N (fake GPUs)", status: done}
    - {id: restd, group: net, label: "slurmrestd (JWT)", status: done}
    - {id: dbd, group: net, label: "slurmdbd", status: done}
    - {id: maria, group: net, label: "MariaDB (tmpfs)", status: done}
    - {id: prom, group: net, label: "Prometheus", status: done}
    - {id: graf, group: net, label: "Grafana", status: done}
    - {id: gpux, group: net, label: "gpu-exporter-farm", status: done}
    - {id: bmc, group: net, label: "bmc-farm", status: done}
    - {id: bcm, group: net, label: "bcm-mock", status: partial}
    - {id: jira, group: net, label: "jira-mock", status: partial}
    - {id: tele, group: net, label: "Teleport access", status: todo}
    - {id: chaos, group: net, label: "scenario engine (simctl)", status: partial}
    - {id: users, group: net, label: "user-sim / ticket-bot", status: todo}
    - {id: k8s, group: net, label: "k3d + KWOK", status: partial}
    - {id: webui, group: net, label: "Web UI", status: partial}
    - {id: app, group: ext, label: "App under test", status: partial}
    - {id: mac, group: ext, label: "macOS agent", status: todo}
  edges:
    - [simctl, sock, commands]
    - [sock, gov, ""]
    - [gov, docker, "freeze / throttle / stop"]
    - [gov, libvirt, "managedsave"]
    - [prom, gov, "scrapes /metrics"]
    - [gov, graf, "annotations"]
    - [slurmd, ctld, "register"]
    - [restd, ctld, ""]
    - [restd, dbd, ""]
    - [ctld, dbd, ""]
    - [dbd, maria, ""]
    - [prom, gpux, "scrape"]
    - [graf, prom, ""]
    - [webui, sock, "only path to the host"]
    - [app, restd, "REST"]
    - [app, bmc, "Redfish"]
    - [app, bcm, ""]
    - [app, jira, ""]
    - [app, tele, "ssh via Teleport"]

next:
  - "user-sim and ticket-bot (they also give the dots Slurm jobs and Jira tickets to draw)."
  - "Phase 0 for std/full (16-32 slurmd, k3d) once those profiles are buildable; only min is measured."

gaps:
  - "Only the min budget is measured (0.17 GB loaded with 60 queued jobs, VMs off); std/full budgets are still estimates."
  - "The governor's own locked memory is about 100-170 MB, slightly over its 0.15 GB budget."
  - "Host swap is 100% full and kubectl/k3d are missing, which blocks the Kubernetes phase here."
