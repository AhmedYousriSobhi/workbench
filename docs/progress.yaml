    - [ctld, dbd, ""]
    - [dbd, maria, ""]
    - [prom, gpux, "scrape"]
    - [graf, prom, ""]
    - [prom, alertm, "alerts"]
    - [alertm, jira, "ticket per alert"]
    - [webui, sock, "only path to the host"]
    - [benchctl, slurmd, "NHC check files (mounted read-only)"]
    - [webui, slurmd, "NHC check files (same validation)"]
