         how: "Vagrantfile, provisioning scripts and up/down helpers exist; not re-verified end to end since the scaffold merge."}

  - id: p7
    title: Web UI and profiles
    goal: One click from cold start to a busy cluster
    items:
      - {name: Profile pre-flight (CLI), status: done, pr: 26, where: benchctl/checks.py,
         how: "`benchctl preflight` refuses a profile when free memory minus its budget is under the safety floor and suggests a smaller one."}
      - {name: Web UI base, status: partial, pr: 76, where: webui/,
         how: "`python -m webui` on 127.0.0.1:8088 with a login token: Governor dashboard (level banner, MemAvailable/PSI sparklines, audit log over SSE) and Scenario Orchestrator (list, Play with speed, Stop, per-step timeline). Reads the governor socket only; Slurm steps are skipped in the UI. ~32 MB RSS on Starlette (ADR 0008). Reviewed in headless Chromium (desktop/phone, light/dark; no console errors or overflow; ARIA tabs, keyboard, status not by colour alone)."}
      - {name: Help wiki in the web page, status: review, pr: 146, where: "webui/wiki.py, docs/manual/11-which-command.md, docs/manual/12-glossary.md",
         how: "`/help/` serves the markdown under docs/ (manual, guides, architecture, ADRs) as linked pages with a sidebar, search and images; a stdlib renderer, pages read per request, same login as the UI. A ? Help link sits in the page header. New manual chapters: which command to use, glossary."}
      - {name: GitHub Wiki from docs, status: review, pr: 149, where: "scripts/sync_wiki.py, .github/workflows/wiki.yml, tests/test_sync_wiki.py, docs/guides/github-wiki.md",
         how: "`scripts/sync_wiki.py --out DIR` turns docs/manual, guides, architecture and ADRs into wiki pages (Home, sidebar, footer, images, rewritten links); `--push` clones the wiki repository, syncs and pushes without printing the token. docs/ stays the only source. A GitHub Actions workflow (.github/workflows/wiki.yml) runs it after every push to dev that changes the docs (issue 113)."}
      - {name: Cluster Canvas, status: partial, pr: 84, where: "webui/cluster.py, webui/static/index.html",
         how: "Cluster view (now an entity list, issue 129): service reachability and a card per sim.yaml node (power, CPU temp, fans, BCM state, GPU XID) refreshed every 3 s, with Power off/on, Overheat, Fan failure, GPU error and Clear actions that go through the mocks. Slurm drain and K8s faults are not offered (UI has no Docker access; K8s not built). Verified live."}
      - {name: App shell and layout, status: review, pr: 91, where: webui/static/index.html,
         how: "One dashboard page (first version, issue 46; the layout was redesigned in issue 129 and later, see Dashboard redesign): a status strip, a calm palette with a soft level banner, light/dark/auto theme, skip link and landmarks, 4 px spacing scale. Based on dashboard and navigation guidance from Splunk, Zuora, Grafana and SaaS UX guides."}
      - {name: Apply a plan from the page, status: review, pr: 119, where: "governor/control.py, governor/core.py, webui/app.py, benchctl/stack.py, docs/adr/0017-apply-a-plan-through-the-governor.md",
         how: "Plan panel Apply button (press twice to confirm): POST /api/plan/apply asks the governor (apply-plan: bounded ints and known parts only) to run `benchctl up --cpu-nodes ...`; stack.up removes unwanted nodes and recreates slurmctld. Refused above L1 or without --workdir. tests/real/test_apply_real.py shrinks then grows a live stack (issue 117)."}
      - {name: Governor panel, entity tree, larger traffic, status: review, pr: 126, where: webui/static/index.html,
         how: "The left column is gone: the level banner and memory/pressure open as a Governor panel from the top-strip chips, so the page has two columns. Entities are a tree (Cluster, Services, Compute nodes, GPU nodes) of highlight cells. The traffic drawing is wider (760 units) with bigger text, packets and lanes (issue 125)."}
      - {name: Dashboard redesign (one screen), status: review, pr: 130, where: "webui/static/index.html, webui/cluster.py, webui/flow.py, webui/connections.py, scripts/ui_shots.py",
         how: "One screen without page scrolling (1280x800, six nodes): the traffic diagram (clients, fault injector, services and every node as a tile; dots curve to services, fault diamonds travel to the node they hit) beside an entity list (Compute nodes, GPU nodes, Services; one card per line with status and quick facts: GPU utilisation meter and busy count, temperature, BCM state, requests per minute). A node opens a panel in place of the list (Actions: faults then recover; Info: connect details and describe text) so the traffic stays visible. Scenarios, Plan and Governor open as sheets from the top strip; Needs attention is a slim bar; a Connections tab lists each part's address, command and credential file path (issues 115, 118, 121, 123, 125, 127, 129; PRs 116, 120, 122, 124, 126, 128)."}
      - {name: Animated workload dots, status: review, pr: 89, where: "webui/flow.py, components/*/ (GET /sim/stats), webui/static/index.html",
         how: "Cluster tab Traffic panel: a dot travels from Clients to a mock each time it serves a real request (the mocks count them at /sim/stats; health checks, /sim calls and the UI's own polls are excluded), a diamond from Fault injector when a fault is applied. SSE at /api/flow opened only while the tab shows; pause button; stops at governor L3+ and for reduced motion. Slurm job dots are not drawn (the UI cannot read the scheduler). ADR 0009."}
      - {name: Budget manager, status: todo, how: "Profile/budget form (W-7)."}

