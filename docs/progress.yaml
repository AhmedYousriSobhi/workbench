    title: macOS agent and CI
    goal: External Mac agent and unattended scenario runs
    items:
      - {name: Mac agent profile and headless CI, status: todo, how: "External agent only (licence); scenario suite with assertions."}

  - id: x
    title: Platform and tooling
    goal: What keeps every change safe and debuggable
    items:
      - {name: validate.sh gate, status: done, pr: 18, where: scripts/validate.sh,
         how: "Secrets scan, compile, ruff, shellcheck, YAML/JSON, systemd verify, pytest and a governor smoke run before every commit."}
      - {name: Public-repo privacy guard and git hooks, status: review, pr: 105, where: "scripts/check-privacy.sh, .githooks/, scripts/install-hooks.sh, SECURITY.md",
         how: "check-privacy.sh blocks home paths, the local username, personal emails, tokens and keys, local-only paths (.claude/, graphify-out/) and symlinks that leave the repo, and prints only file:line and the rule. Tracked hooks: pre-commit (no commits on main/dev, privacy, validate.sh), commit-msg (issue reference), pre-push (no push to main/dev, full scan); installed by install-hooks.sh. validate.sh runs the scan too. Issue 54."}
      - {name: Unit-test coverage gate, status: done, pr: 81, where: "tests/, scripts/validate.sh",
         how: "validate.sh runs the unit tests under coverage and fails below 90% (override COV_FLOOR). 226 tests, 98% of benchctl, governor, webui and components. Not covered by unit tests, by design: code that needs root, a live Docker stack or a browser (tests/real)."}
      - {name: Real-host tests, status: done, pr: [20, 22], where: "scripts/real-test.sh, scripts/real-test-root.sh",
         how: "User-level tests with cgroups, Docker, libvirt and a live governor; a sudo suite for root-only paths."}
      - {name: Rootless governor (no sudo), status: review, pr: 98, where: "governor/executors.py, scripts/benchctl-launch, benchctl/checks.py",
         how: "`python -m governor --user-mode` pauses/stops containers through the Docker API, skips memory.high throttle and reclaim, keeps the ladder, admission, watchdog and metrics, listens under $XDG_RUNTIME_DIR. `benchctl start` runs it when no system service is up. Live-tested: freeze/thaw of a real container, no sudo called. ADR 0010."}
      - {name: One controller command (benchctl), status: review, where: "benchctl/cli.py, benchctl/inventory.py, scripts/benchctl",
         how: "`benchctl VERB [RESOURCE] [NAME]` like kubectl: get nodes|services|profiles|scenarios (-o json), exec NODE, logs NODE, start/stop/open (launcher), plus every older command; node-name tab completion; the old command and project names were removed in #111; docs and tests name only benchctl (ADR 0015). Typos get a Did-you-mean hint and are never run; errors go to stderr; docs/guides/benchctl-verbs.md lists each verb's limits (issues 90, 98)."}
      - {name: Logo and README, status: review, where: "scripts/make_logo_assets.py, docs/assets/, docs/guides/brand-assets.md, README.md",
         how: "A W of servers on a bench (teal nodes, a dashed amber governed node), as logo.svg, a small cut for 16 to 32 px, favicons and touch icon, all built from one script and checked by validate.sh; the web page header and tab icons use it. The README is now a short five-step guide: wake it up, poke it, build your own, point your app at it, put it back. Issue 89 (logo part; the name decision is still open)."}
      - {name: Export workbench as client profile, status: review, where: "benchctl/export.py, benchctl/cli.py, docs/guides/export-profile.md",
         how: "`benchctl export profile [--bmc] [--user] [--name] [--format] [--configured]` writes the cluster running now (Docker; parts and nodes that are not up are left out, falls back to the configured selection with a note) and the page has an ⇩ Export button (GET /api/export/profile, selection read from disk, no Docker). Writes the workbench as a profile file the client imports (SSH, Slurm, Grafana, Jira, storage, optional BMC targets; parts not built are left out; no secrets). The client's format ID is read locally (.git/export-format, env or flag), never written in the repo. Verified: the client's own parser accepts the output (1 cluster, 6 BMC targets). Issue 91."}
      - {name: Describe a node (CLI and page), status: review, where: "benchctl/describe.py, benchctl/cli.py, webui/app.py, webui/static/index.html",
         how: "`benchctl describe node NAME [-o json]` and the Info card of a node's panel on the page show the same text from one gatherer: container (state, image, memory limit, class), Slurm state and jobs, GPUs busy/idle and XID, BMC power/temperature/fans, ssh hint. A source that is down is one note. The page omits Docker and Slurm lines (no Docker access by design). Issue 93."}
      - {name: Choose the workbench (plan and apply), status: review, where: "benchctl/workbench.py, benchctl/cli.py, benchctl/stack.py, benchctl/compose.py, webui/app.py",
         how: "`benchctl plan --cpu-nodes 2 --gpu-nodes 4 --with jira` prints the memory the selection needs against free memory (exit 1 and a hint when it does not fit); `up` with the same flags, or `apply -f FILE`, admits by that estimate and builds it. Parts: jira, bmc, bcm, accounting, scenarios, load; Kubernetes refused until built. The effective sim is written to compose/generated/sim.yaml so slurm.conf, the BMC farm, the GPU exporter, get, describe and export agree. The page has a Cluster architecture sheet (was Plan, then Settings; estimate only, W-3) whose optional parts, with their memory cost, come from one registry (workbench.PART_INFO, GET /api/settings); accounting is a default part and `benchctl start --with accounting` or the sheet adds it to a running cluster (slurmctld restarts). Power off from the page also marks the node down in Slurm through the governor (node-state, `benchctl set node`; `benchctl set node on|off` does the page's whole power action). `benchctl load on|off` runs simulated users on the login node (images/login/user_sim.py: Poisson arrivals, cpu and GPU jobs, issue 153); `benchctl submit NODE` and the node panel's Workload buttons submit a sleep job pinned to a node, through the governor's submit-job (issue 156). Issues 135-137. Fixed addressing plan (ADR 0018, issue 148): every container has a fixed private IP (10.141.x.x, login 10.141.255.254), the export, Connections tab and docs use them with 127.0.0.1 as the fallback, up refuses a conflicting network; every node's BMC has its own address on the ipmi network (10.148.x.y:443): a 32 MB forwarder per BMC to the farm, which keeps the state; switch BMCs off per node in Settings or with --bmc-nodes (issue 149). Node health check: images/node-base/nhc runs as HealthCheckProgram, Prolog (fails an unhealthy node so the job requeues) and Epilog; it drains on a missing GPU, an XID, a down InfiniBand port or a flapping NIC (exporter farm models both; page actions, scenario ib-port-down) and resumes its own drain; slurmctld's node_watch.py files or comments a Jira ticket when Slurm takes a node out of service (issues 143, 160); a powered-off node stops publishing GPU metrics; up restarts slurmctld when slurm.conf changes (issues 138-141). Verified live: 2 cpu + 3 gpu nodes x 4 GPUs. ADR 0016. Issue 92."}
      - {name: Tab completion, status: review, where: "benchctl/completion.py, benchctl/cli.py, scripts/benchctl, tests/test_completion.py, tests/real/test_completion_real.py",
         how: "`benchctl completion install|remove|bash|zsh|fish`: no sudo, one rc line, a ~/.local/bin/benchctl link; `start` offers it once in a terminal. Completes resources, nodes and services, --profile, scenario names, --user, --with/--without, -o, -l and --sort-by from files only (no Docker). A wrong profile, node or scenario gets Did you mean plus the valid list, exit 2."}
      - {name: NHC checks managed three ways, status: review, where: "benchctl/nhc.py, images/node-base/nhc.d, images/node-base/nhc, benchctl/cli.py, webui/app.py, webui/static/index.html, docs/guides/nhc-checks.md",
         how: "The node health check is a runner over files: images/node-base/nhc.d/checks.conf plus one script per check and parameterised templates (metric-above, metric-below); each check runs isolated with a 10 s timeout and prints one line per problem. Change them from the CLI (`benchctl get|add|set|remove|validate|reload check(s)`), by editing the files then `reload checks`, or in the page's Health checks sheet (drag to reorder, toggle, parameters, remove, add from a template; arrow buttons for the keyboard; templates only, never a script). One module validates every change on a copy (grammar, parameters, bash -n, contract, a smoke run on healthy sample metrics) and writes only a valid set, then delivers it to compose/generated/nhc, which nodes mount read-only: live within 30 s, no rebuild. ADR 0019, issue 170. Tests: tests/test_nhc_manage.py, tests/real/test_nhc_browser.py (Chromium, run); tests/real/test_nhc_real.py (live node, to be run with verify.sh)."}
      - {name: Top bar for status, actions in one menu, status: review, where: "webui/static/index.html, scripts/ui_shots.py",
         how: "The top strip keeps live status (governor, memory, services, nodes, running scenario, connection) and one Menu button; Scenarios, Cluster architecture, Health checks and Export are grouped Run / Configure / Share with a one-line hint each, so a new feature adds a menu item, not a chip. Disclosure pattern (aria-expanded, aria-controls), Esc closes and returns focus, outside click and choosing an item close it; on a phone it opens full width below the strip. scripts/ui_shots.py checks it opens, fits the screen and closes with focus back. Issue 172."}
      - {name: One-command launcher, status: review, pr: 95, where: scripts/benchctl-launch,
         how: "`./scripts/benchctl start` runs the machine check, creates the venv if missing, notes whether the governor is installed, brings the cluster up and starts the web page in the background, then prints the login link; `stop`, `status`, `open`. Idempotent. Live-tested start, second start, stop."}
      - {name: Initial machine check, status: review, pr: 87, where: "benchctl/machine.py, scripts/check-machine.sh",
         how: "`./scripts/check-machine.sh` (system python3 only, runs before any build) checks OS, cores, RAM, disk, cgroup v2, Docker daemon and compose, free ports, optional tools, and which profiles fit; READY or NOT READY with a fix per problem. Also `benchctl check`."}
      - {name: benchctl doctor / status / diag, status: done, pr: 26, where: "benchctl/checks.py, benchctl/diag.py",
         how: "Environment checks with fixes, governor state, a masked diagnostics tarball, and the container security check."}
      - {name: Observability stack, status: done, where: compose/observability.yml,
         how: "Prometheus (2 d, tmpfs), Grafana with provisioned dashboard, fake GPU exporter."}
      - {name: Decisions as ADRs, status: done, where: docs/adr,
         how: "0001 record decisions, 0002 Slurm from source with no extra privileges, 0003 slurmrestd/JWT and accounting, 0004 slurmrestd keeps its unshare steps disabled, 0011 SSH login node."}
      - {name: Getting-started guide, status: done, pr: 52, where: docs/guides/getting-started.md,
         how: "Step-by-step use of the app; tests/test_docs.py fails if a documented command disappears."}
      - {name: User manual, status: review, where: docs/manual,
         how: "Ten chapters with screenshots of the web page and real terminal output (concepts, install, using the cluster, nodes and shells, web page, scenarios, governor, configuration, troubleshooting, reference). Commands were run against a live min stack; tests/test_docs.py checks that every command, script and node name it uses exists. The guide gained a step for getting a shell on a node (docker exec; nodes have no sshd)."}
      - {name: Verification helpers, status: done, pr: 48, where: scripts/verify.sh,
         how: "verify.sh runs validate.sh plus real tests (--full adds the live stack lifecycle); tests/real/helpers.py starts a live governor and talks to its socket."}
      - {name: Progress tracker, status: done, pr: 42, where: benchctl/progress.py,
         how: "This page, generated from docs/progress.yaml (issue 19)."}

