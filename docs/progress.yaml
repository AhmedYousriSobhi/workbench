# Single source of truth for docs/PROGRESS.md and docs/progress.html.
# Regenerate with: python -m benchctl.progress   (validate.sh fails if the outputs are stale)
# status: done = merged and verified | review = in an open PR | partial = some of it works | todo = not started
# `where` paths are checked to exist for done/partial items.
updated: 2026-11-01
repo: https://github.com/AhmedYousriSobhi/workbench
# PR numbers up to this belong to the previous repository (before the move) and are shown without links.
legacy_pr_max: 160

phases:
  - id: p0
    title: Baseline
    goal: Measure real memory so budgets stop being guesses
    items:
      - {name: Measurement tooling, status: done, pr: 28, where: benchctl/measure.py,
         how: "`benchctl measure run/report` samples host, Docker containers, PSS per process and libvirt domains (read-only), saves JSON, suggests budgets = peak x 1.2."}
      - {name: Host baseline, status: partial,
         how: "Idle host and a small Slurm stack were measured (slurmd 5 MiB, slurmctld 13, MariaDB 171). No loaded run with mocks yet."}
      - {name: Budgets replaced by measured values, status: partial, pr: 68, where: profiles/min.yaml,
         how: "min measured live (VMs off, 60 queued jobs): 0.17 GB peak across containers, budget set to 1 GB. std/full are still estimates."}

  - id: p1
    title: Governor
    goal: A root service that keeps the host alive by escalating through a ladder
    items:
      - {name: Signals and escalation ladder, status: done, pr: 14, where: "governor/signals.py, governor/ladder.py",
         how: "MemAvailable, PSI and swap rate feed levels L0-L5. Escalates at once, steps down one level per 60 s calm with a 10 s dwell."}
      - {name: Priority planner, status: done, pr: 14, where: governor/planner.py,
         how: "P0-P6 classes; lowest priority first, reversible actions before destructive ones; undo on de-escalation."}
      - {name: Executors, status: done, pr: 20, where: governor/executors.py,
         how: "freeze, throttle (memory.high), reclaim, stop (cgroup.kill then docker stop), managedsave for VMs, via cgroup files opened in advance."}
      - {name: mlockall and pre-allocated mitigation path, status: done, pr: 19, where: governor/memlock.py,
         how: "Locks its own pages and pre-opens handles and buffers so L3/L4 performs no allocation (SPEC GV-8)."}
      - {name: Control socket, status: done, pr: 19, where: governor/control.py,
         how: "JSON lines on /run/workbench/gov.sock with a fixed allow-list; unknown commands are rejected."}
      - {name: NF-1 memory-hog test, status: done, pr: 24, where: tests/real/test_root.py,
         how: "A real container hog is throttled, frozen then stopped in order; no host OOM. Runs as root via scripts/real-test-root.sh."}
      - {name: Security watchdog, status: done, pr: 34, where: governor/watchdog.py,
         how: "Every 15 s flags privileged/capability/unconfined/host-namespace/docker.sock containers, missing limits and live memory.max drift. Report only; skipped from L3 up."}
      - {name: Monitored slurmrestd exception, status: done, pr: 44, where: governor/watchdog.py,
         how: "slurmrestd runs with two unshare steps disabled (ADR 0004). Any wider SLURMRESTD_SECURITY option is a violation; doctor lists the accepted exception."}
      - {name: Inventory refresh and Grafana annotations, status: done, pr: 36, where: "governor/annotate.py, governor/core.py",
         how: "Re-discovers containers so late starters are governed; posts audit events to Grafana with a token from the environment (SPEC GV-6)."}
      - {name: systemd unit installed permanently, status: partial, where: systemd,
         how: "Unit and slice pass systemd-analyze and ran as a transient service in tests; scripts/install-governor.sh installs it as the standing service (printed unit tested; the sudo install itself is run by the user)."}
      - {name: Admission and real scale / set-profile, status: done, pr: 48, where: governor/core.py,
         how: "admit command (GV-9): refused at L2+ or if it would breach the floor; scale and set-profile run benchctl in the background at L0-L1 only (GV-8). benchctl up/scale ask first. Verified live through the socket."}
      - {name: Governor /metrics endpoint, status: done, pr: 60, where: governor/metrics.py,
         how: "Prometheus text (level, MemAvailable, PSI, swap, groups per priority, actions, admissions) bound to the docker bridge address, rendered once per step so a scrape does no work (GV-8). The Prometheus 'governor' target is up on the live stack."}
      - {name: Live ladder test on the real stack, status: done, pr: 60, where: tests/real/test_pressure_real.py,
         how: "Dry-run governor against the running containers: L0 to L3 and back, /metrics, Grafana annotations and the planned throttle/freeze/thaw actions. The root variant passes on the dev machine: L3 really freezes a live container's cgroup (cgroup.events frozen 1), keeps P1 services running, and thaws on recovery; it also exposed and fixed the nested-slice cgroup path bug (PR 64)."}
      - {name: Host tuning script and benchctl top, status: todo,
         how: "zram, swappiness and THP tuning with confirmation, and a live view of the governor."}

  - id: p2
    title: Slurm
    goal: A real scheduler the app can read, built from sim.yaml
    items:
      - {name: Slurm 26.05.5 images, status: done, pr: 32, where: images/node-base/Dockerfile,
         how: "Built from the SchedMD tarball (pinned and SHA256-checked) because Ubuntu's 23.11 lacks the 2026 security fixes; no extra container privileges (ADR 0002)."}
      - {name: Generated Slurm config, status: done, pr: 32, where: benchctl/slurmconf.py,
         how: "slurm.conf, gres.conf and cgroup.conf derive from sim.yaml so node names match everywhere; fake GPUs use /dev/null-backed device files."}
      - {name: Compose generation, status: done, pr: 30, where: benchctl/compose.py,
         how: "`benchctl compose --profile X` renders services with mem_limit, cgroup_parent and the workbench.class label from sim.yaml and profiles."}
      - {name: slurmrestd with JWT, status: done, pr: 38, where: benchctl/compose.py,
         how: "JWT-only REST on the internal network, own user, no privileges; skips two unshare steps instead of loosening seccomp (ADR 0003, ADR 0004). Verified live: no token 401, bad tokens get no data."}
      - {name: Accounting, status: done, pr: 38, where: benchctl/slurmconf.py,
         how: "MariaDB on a capped tmpfs plus slurmdbd; sacctmgr bootstrap creates cluster, QOS and users from sim.yaml; secrets stay in a gitignored folder. Verified live: a job as alice appears in sacct and the REST slurmdb endpoint."}
      - {name: benchctl up / down / scale, status: done, pr: 45, where: benchctl/stack.py,
         how: "Pre-flight, staged start (observability, slurm, nodes), skips unbuilt mocks, scale regenerates slurm.conf, Grafana token created once (0600). Verified live with min; scale really stops containers."}

  - id: p3
    title: Mocks
    goal: Fake BMC, BCM and Jira so the app's integrations can be exercised
    items:
      - {name: gpu-exporter-farm, status: done, where: components/gpu-exporter-farm/exporter.py,
         how: "One process serving fake DCGM metrics for every simulated GPU (util, FB used and free, temp, power, XID) with the real exporter labels (Hostname, UUID, modelName), fault injection over /sim/inject. A read-only Grafana token for clients is made by benchctl up. Verified live through Grafana /api/ds/query."}
      - {name: bmc-farm, status: done, pr: 52, where: components/bmc-farm/bmc.py,
         how: "One process serves /<node>/redfish/v1 for every node: Systems, Chassis Thermal/Power, Managers, event log, Reset action, POST /sim/inject (temp, fans, power, events). Also standard Redfish over TLS on 127.0.0.1:8443 (Host picks the node, session login, collections, firmware, accounts; ADR 0012). Verified live in the stack."}
      - {name: bcm-mock, status: partial, pr: 71, where: components/bcm-mock/bcm.py,
         how: "CMDaemon-style POST /json (cmdevice, cmstatus, cmpart) over the sim.yaml nodes, power calls and /sim/inject. Call names are an assumed subset (ADR 0005); verified live, 12 MiB."}
      - {name: Fake cmsh on the login node, status: done, where: images/login/cmsh.py, how: "cmsh -c \"device; list\" / \"device; status\" / category, jobqueue and healthchecks lists on the login node (the BCM head node), state read from bcm-mock so a scenario that takes a node down shows DOWN; mutating commands refused; read-only interactive console with modes (ADR 0013). Verified live: tests/real/test_cmsh_real.py."}
      - {name: jira-mock, status: partial, pr: 71, where: components/jira-mock/jira.py,
         how: "Mode mock only: REST v2/v3 issues, POST search (/search/jql token paging, /search offset paging), myself, serverInfo, field, project, JQL with OR/NOT/parentheses/text search, comments (read, edit, delete), issue edit, watchers, worklog, assign, user search, workflow transitions with required-field errors, JQL subset, webhooks, 429/503/slow failures, and /sim/tickets for scenarios (ADR 0005, issue 107); node faults file one Incident per node and kind (comment on a repeat, resolve on recovery) through the scenario engine's side effects (issue 157); a background team moves, comments, reassigns, reopens and files tickets (GET|POST /sim/activity, JIRA_ACTIVITY_EVERY, `benchctl set jira-activity`, issue 158). Verified live in the container (transitions, JQL, webhook to an outside receiver, 429/503), 15 MiB. cloud/dc modes not built."}
      - {name: SSH login node, status: done, where: images/login, how: "sshd + Slurm client tools on 127.0.0.1:2222, key login only, forwarding on, keys generated by benchctl up (ADR 0011). Verified live: sinfo over SSH, root and password refused, port forward to a mock."}
      - {name: sshd on compute nodes, status: done, where: images/node-base, how: "sshd in node-base, started on nodes only (WORKBENCH_SSHD): ssh cn001 from the login node with no prompt (cluster key, shared node host key), a client ProxyJump or execution target to a node, srun and srun --pty. Reached through the login node only (ADR 0014). up builds node-base first. Verified live: tests/real/test_node_ssh_real.py."}
      - {name: Client setup by component, status: review, where: docs/guides/client-setup-by-component.md, how: "One section per client component (SSH, Slurm, Grafana, storage, Jira, BCM, BMC): values, where to get them, what to expect, common failure. Values checked against the live stack; not walked in the client window. Issue 82."}
      - {name: Normal shell on nodes, status: review, where: images/node-base/Dockerfile, how: "Simulated users get bash (useradd default), bash-completion, Slurm tab completion from the Slurm source tree, history, a user@node prompt and Slurm on the login-shell PATH. Verified live: tests/real/test_login_real.py. Issue 81."}
      - {name: Client key helper, status: review, where: "benchctl/stack.py, benchctl/cli.py", how: "benchctl ssh-key install|remove: copies the login key to ~/.ssh/workbench_ed25519 (mode 600) for clients that only read keys under ~/.ssh; refuses to overwrite a foreign file. Issue 80."}
      - {name: GPU metrics follow Slurm jobs, status: review, where: "components/gpu-exporter-farm/exporter.py, images/slurm-ctl/alloc_feed.py", how: "slurmctld serves the GPU indexes running jobs hold (internal :9401); the exporter polls it every 3 s and shows those GPUs busy, the rest idle (last answer kept 30 s if the feed is down). Verified live: tests/real/test_gpu_follows_slurm_real.py. Issue 83."}
      - {name: Teleport access, status: review, where: "benchctl/teleport.py, images/node-base/teleport-ssh", how: "Optional part (--with teleport): real Teleport auth+proxy container, agentless OpenSSH nodes trusting its CA, identity file per user, benchctl add invite for tsh login (ADR 0020). Unit-tested; live test tests/real/test_teleport_real.py. Not yet: outage and cert-expiry scenarios, Web UI entry, measured memory budget. Issue 39."}

  - id: p4
    title: People and chaos
    goal: Simulated users and engineers, scripted faults
    items:
      - {name: Scenario files, status: partial, where: scenarios, pr: 73,
         how: "Twelve scenarios: ib-port-down, gpu-xid-storm, node-down, fan-failure, jira-429, jira-outage, jira-flap, ticket-lifecycle, drain-ticket and ticket-wave run now; pod-crashloop and k8s-node-notready need k3d/KWOK."}
      - {name: user-sim and ticket-bot, status: todo, how: "Personas with Poisson arrivals and engineers working tickets."}
      - {name: scenario-engine, status: partial, pr: 73, where: benchctl/scenario.py,
         how: "`benchctl scenario list|run NAME [--speed N] [--dry-run]`: steps drive bmc-farm, bcm-mock, gpu-exporter, jira-mock, Slurm (scontrol) and the login node's sshd (ssh target: down, hung, up, rotate_host_key, max_sessions, reject_auth, node_sshd + nodes, reset; scenarios ssh-host-key-changed, login-node-down, login-node-hung, ssh-session-limit, ssh-key-refused, ssh-node-sshd-down; tests/real/test_ssh_faults_real.py); ramps; expect (slurm.node_state, jira.issue_created) watched from the start; k8s and ticket-bot steps skipped. Runs in the host CLI, not a container (ADR 0006). Verified live."}

  - id: p5
    title: Kubernetes
    goal: Mixed real and fake K8s nodes
    items:
      - {name: Cluster fixtures, status: done, where: k8s/fixtures,
         how: "Namespaces, workloads, failure signals and a read-only RBAC role, applied with apply.sh."}
      - {name: k3d plus KWOK cluster, status: partial,
         how: "Design is set but kubectl and k3d are not installed on this host, so it has not been brought up."}

  - id: p6
    title: Fidelity VM
    goal: One real Ubuntu VM with Redfish power control
    items:
