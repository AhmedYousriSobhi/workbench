         how: "verify.sh --full stops the cluster and clears the saved selection before the real tests (restored on exit); an autouse fixture fails the test or module that leaves a workbench container paused and thaws it; test_real runs isolated; the scenario test unpauses cn004. Issues 530, 532, 534."}
      - {name: Public-repo privacy guard and git hooks, status: review, pr: 105, where: "scripts/check-privacy.sh, .githooks/, scripts/install-hooks.sh, SECURITY.md",
         how: "check-privacy.sh blocks home paths, the local username, personal emails, tokens and keys, local-only paths (.claude/, graphify-out/) and symlinks that leave the repo, and prints only file:line and the rule. Tracked hooks: pre-commit (no commits on main/dev, privacy, validate.sh), commit-msg (issue reference), pre-push (no push to main/dev, full scan); installed by install-hooks.sh. validate.sh runs the scan too. Issue 54."}
      - {name: Unit-test coverage gate, status: done, pr: 81, where: "tests/, scripts/validate.sh",
         how: "validate.sh runs the unit tests under coverage and fails below 90% (override COV_FLOOR). 226 tests, 98% of benchctl, governor, webui and components. Not covered by unit tests, by design: code that needs root, a live Docker stack or a browser (tests/real)."}
      - {name: Real-host tests, status: done, pr: [20, 22], where: "scripts/real-test.sh, scripts/real-test-root.sh",
         how: "User-level tests with cgroups, Docker, libvirt and a live governor; a sudo suite for root-only paths."}
      - {name: Rootless governor (no sudo), status: review, pr: 98, where: "governor/executors.py, scripts/benchctl-launch, benchctl/checks.py",
         how: "`python -m governor --user-mode` pauses/stops containers through the Docker API, skips memory.high throttle and reclaim, keeps the ladder, admission, watchdog and metrics, listens under $XDG_RUNTIME_DIR. `benchctl start` runs it when no system service is up. Live-tested: freeze/thaw of a real container, no sudo called. ADR 0010."}
      - {name: One controller command (benchctl), status: review, where: "benchctl/cli.py, benchctl/inventory.py, scripts/benchctl",
         how: "`benchctl VERB [RESOURCE] [NAME]` like kubectl: get nodes|services|profiles|scenarios (-o json), exec NODE, logs NODE, start/stop/open (launcher), plus every older command; node-name tab completion; the old command and project names were removed in #111; docs and tests name only benchctl (ADR 0015). Typos get a Did-you-mean hint and are never run; errors go to stderr; docs/guides/benchctl-verbs.md lists each verb's limits (issues 90, 98)."}
      - {name: Wiki renderer and sync for the illustrated template, status: review, where: "webui/wiki.py, scripts/sync_wiki.py, tests/test_wiki.py, tests/test_sync_wiki.py, docs/guides/github-wiki.md",
         how: "The in-page help and the GitHub Wiki sync understand alerts (five GitHub kinds plus HOOD and DIDYOUKNOW), details and summary, centred images, picture, kbd and figure captions; other tags stay escaped. The sync rewrites the two project callouts, copies docs/assets/art and rewrites img and srcset paths. Issue 585."}
      - {name: Documentation art generator, status: review, where: "scripts/make_doc_art.py, docs/assets/art/, tests/test_doc_art.py, docs/guides/brand-assets.md",
         how: "Theme-aware SVG illustrations built from one script with shared primitives (node, rack, wire with pulse, cloud of mocks, governor badge), a --check that validate.sh runs, and a test for size, title, dark scheme, reduced motion and 4.5:1 text contrast. First three: the README hero, how-it-works strip and memory bar. Issue 583."}
      - {name: Logo and README, status: review, where: "scripts/make_logo_assets.py, docs/assets/, docs/guides/brand-assets.md, README.md",
         how: "A W of servers on a bench (teal nodes, a dashed amber governed node), as logo.svg, a small cut for 16 to 32 px, favicons and touch icon, all built from one script and checked by validate.sh; the web page header and tab icons use it. The README is now a short five-step guide: wake it up, poke it, build your own, point your app at it, put it back. Issue 89 (logo part; the name decision is still open)."}
      - {name: Requests zoom level and demo client, status: review, where: "webui/static/js/zoom.js, webui/static/index.html, images/login/mock_sim.py, benchctl/workload.py, benchctl/cli.py, docs/adr/0070-requests-is-the-fifth-zoom-level.md",
         how: "The Traffic tab shows the communication links at the Traffic stop and the request river one zoom level deeper at a new Requests stop (rail, + and -, Ctrl + scroll, Back to the links, Esc), instead of stacking both. `benchctl load on --mocks` starts an opt-in demo client on the login node that calls Jira, BCM and the BMC farm, so the links and the river have counted requests; `load off` stops it. Issue 650."}
      - {name: One colour system (palette and generator), status: review, where: "docs/assets/palette.yaml, scripts/make_palette.py, webui/static/tokens.css, tests/test_palette.py, tests/test_contrast.py, tests/test_cvd.py, tests/test_stylesheet_colours.py, scripts/style_dump.py, docs/adr/0069-one-colour-system-from-one-palette-file.md",
         how: "Step 1 of the colour programme (issue 642): one palette file anchored on the logo's teal, ink and amber, four themes plus the always-dark canvas, six plane colours with six line types, interaction states and chart colours, generated into tokens.css (a --check that validate.sh runs) and tested for contrast, colour-blind distance, line types at 1.5 px, states, prefers-contrast and determinism. Step 2 (issue 644) moved app.css, canvas.css and the help page onto it with no visible change (a temporary legacy block keeps today's values; scripts/style_dump.py compares computed colours of every element in four themes). Step 3 (issue 645): the traffic diagram, legend and chips name planes (data-plane) and tokens.css paints them, so a plane has one colour and one line type in every view; no colour literals left in the JS. Step 4 (issue 646): the new look, with the legacy block deleted: teal is accent, selection and good, amber means attention only, real and simulated differ by outline, node squares are teal (down grey), six planes with six line types, selection is a ring. Step 5 (issue 647): the logo script and the documentation art read the palette, and theme-init.js applies the saved theme before first paint (a 'self' script, CSP unchanged; ui_shots.py checks it). Step 6 (issue 648): a generated colour guide (docs/guides/colour-system.md, swatches in docs/assets/palette/) with contrast per theme and what each token is for and never for; manual, canvas guide and CLAUDE.md updated; screenshots regenerated. The Grafana overview dashboard gets threshold colours written from the palette (issue 651: XID errors, GPU temperature limit lines). Canvases (Circuit, fleet, pool, analysis) follow the page theme (issue 649): the --cv-* names are aliases of each theme's tokens, which also fixed the Circuit view having no colours outside a .canvas element."}
      - {name: Export workbench as client profile, status: review, where: "benchctl/export.py, benchctl/cli.py, docs/guides/export-profile.md",
         how: "`benchctl export profile [--bmc] [--user] [--name] [--format] [--configured]` writes the cluster running now (Docker; parts and nodes that are not up are left out, falls back to the configured selection with a note) and the page has an ⇩ Export button (GET /api/export/profile, selection read from disk, no Docker). Writes the workbench as a profile file the client imports (SSH, Slurm, Grafana, Jira, storage, optional BMC targets; parts not built are left out; no secrets). The client's format ID is read locally (.git/export-format, env or flag), never written in the repo. Verified: the client's own parser accepts the output (1 cluster, 6 BMC targets). Issue 91."}
      - {name: Describe a node (CLI and page), status: review, where: "benchctl/describe.py, benchctl/cli.py, webui/app.py, webui/static/index.html",
         how: "`benchctl describe node NAME [-o json]` and the Info card of a node's panel on the page show the same text from one gatherer: container (state, image, memory limit, class), Slurm state and jobs, GPUs busy/idle and XID, BMC power/temperature/fans, ssh hint. A source that is down is one note. The page omits Docker and Slurm lines (no Docker access by design). Issue 93."}
      - {name: Choose the workbench (plan and apply), status: review, where: "benchctl/workbench.py, benchctl/cli.py, benchctl/stack.py, benchctl/compose.py, webui/app.py",
         how: "`benchctl plan --cpu-nodes 2 --gpu-nodes 4 --with jira` prints the memory the selection needs against free memory (exit 1 and a hint when it does not fit); `up` with the same flags, or `apply -f FILE`, admits by that estimate and builds it. Parts: jira, bmc, bcm, accounting, scenarios, load; Kubernetes refused until built. The effective sim is written to compose/generated/sim.yaml so slurm.conf, the BMC farm, the GPU exporter, get, describe and export agree. The page has a Cluster architecture sheet (was Plan, then Settings; estimate only, W-3) whose optional parts, with their memory cost, come from one registry (workbench.PART_INFO, GET /api/settings); accounting is a default part and `benchctl start --with accounting` or the sheet adds it to a running cluster (slurmctld restarts). Power off from the page also marks the node down in Slurm through the governor (node-state, `benchctl set node`; `benchctl set node on|off` does the page's whole power action). `benchctl load on|off` runs simulated users on the login node (images/login/user_sim.py: Poisson arrivals, cpu and GPU jobs, issue 153); `benchctl submit NODE` and the node panel's Workload buttons submit a sleep job pinned to a node, through the governor's submit-job (issue 156). Issues 135-137. Fixed addressing plan (ADR 0018, issue 148): every container has a fixed private IP (10.141.x.x, login 10.141.255.254), the export, Connections tab and docs use them with 127.0.0.1 as the fallback, up refuses a conflicting network; every node's BMC has its own address on the ipmi network (10.148.x.y:443): a 32 MB forwarder per BMC to the farm, which keeps the state; switch BMCs off per node in Settings or with --bmc-nodes (issue 149). Node health check: images/node-base/nhc runs as HealthCheckProgram, Prolog (fails an unhealthy node so the job requeues) and Epilog; it drains on a missing GPU, an XID, a down InfiniBand port or a flapping NIC (exporter farm models both; page actions, scenario ib-port-down) and resumes its own drain; slurmctld's node_watch.py files or comments a Jira ticket when Slurm takes a node out of service (issues 143, 160); a powered-off node stops publishing GPU metrics; up restarts slurmctld when slurm.conf changes (issues 138-141). Verified live: 2 cpu + 3 gpu nodes x 4 GPUs. ADR 0016. Issue 92."}
      - {name: Tab completion, status: review, where: "benchctl/completion.py, benchctl/cli.py, scripts/benchctl, tests/test_completion.py, tests/real/test_completion_real.py",
         how: "`benchctl completion install|remove|bash|zsh|fish`: no sudo, one rc line, a ~/.local/bin/benchctl link; `start` offers it once in a terminal. Completes resources, nodes and services, --profile, scenario names, --user, --with/--without, -o, -l and --sort-by from files only (no Docker). A wrong profile, node or scenario gets Did you mean plus the valid list, exit 2."}
      - {name: NHC checks managed three ways, status: review, where: "benchctl/nhc.py, images/node-base/nhc.d, images/node-base/nhc, benchctl/cli.py, webui/app.py, webui/static/index.html, docs/guides/nhc-checks.md",
         how: "The node health check is a runner over files: images/node-base/nhc.d/checks.conf plus one script per check and parameterised templates (metric-above, metric-below); each check runs isolated with a 10 s timeout and prints one line per problem. Change them from the CLI (`benchctl get|add|set|remove|validate|reload check(s)`), by editing the files then `reload checks`, or in the page's Health checks sheet (drag to reorder, toggle, parameters, remove, add from a template; arrow buttons for the keyboard; templates only, never a script). One module validates every change on a copy (grammar, parameters, bash -n, contract, a smoke run on healthy sample metrics) and writes only a valid set, then delivers it to compose/generated/nhc, which nodes mount read-only: live within 30 s, no rebuild. ADR 0019, issue 170. Tests: tests/test_nhc_manage.py, tests/real/test_nhc_browser.py (Chromium, run); tests/real/test_nhc_real.py (live node, to be run with verify.sh)."}
      - {name: Workspace navigation and Traffic & Communication list, status: review, where: "webui/static/index.html, scripts/ui_shots.py, docs/adr/0035-workspace-navigation.md, webui/comms.py, benchctl/slurmstats.py, webui/monitoring.py, benchctl/k8s.py, k8s/fixtures/45-rbac-metrics.yaml, governor/core.py, tests/test_webui_comms.py, tests/test_slurmstats.py",
         how: "Left navigation (Infrastructure, Traffic & Communication, Connections, Scenarios, Cluster architecture) replaces the tab strip; the Traffic tab lists the documented links of the parts present (webui/comms.py: protocol, default port, plane), each real or simulated and observed (counter, with its real request count) or configured, plus the measured probe latency (webui/flow.py; slurmctld request counts from sdiag through the read-only governor command slurm-stats, benchctl/slurmstats.py; slurmdbd answers (one sacctmgr query, same command, #400); Prometheus scrape links with Prometheus's own timings (webui/monitoring.py), a grouped link diagram with a traffic flow inspector panel and rate chart, a dark-first default theme, a link inspector, request rate, filters by plane/software/evidence and path following; the Kubernetes API server's request total through a read-only metrics user, k8s/fixtures/45-rbac-metrics.yaml). Prometheus, Grafana, slurmdbd and storage links wait until the snapshot reports them. Fleet and cluster views wait for epic 256. Issue 394 (children 395-398). The node parts show nodes in service and follow drain, power and Kubernetes faults every 5 s, with timeline entries (issue 414; Slurm node states from sinfo in the governor's slurm-stats)."}
      - {name: Top bar for status, actions in one menu, status: review, where: "webui/static/index.html, scripts/ui_shots.py",
         how: "The top strip keeps live status (governor, memory, services, nodes, running scenario, connection) and one Menu button; Scenarios, Cluster architecture, Health checks and Export are grouped Run / Configure / Share with a one-line hint each, so a new feature adds a menu item, not a chip. Disclosure pattern (aria-expanded, aria-controls), Esc closes and returns focus, outside click and choosing an item close it; on a phone it opens full width below the strip. scripts/ui_shots.py checks it opens, fits the screen and closes with focus back. Issue 172."}
      - {name: One-command launcher, status: review, pr: 95, where: scripts/benchctl-launch,
         how: "`./scripts/benchctl start` runs the machine check, creates the venv if missing, notes whether the governor is installed, brings the cluster up and starts the web page in the background, then prints the login link; `stop`, `status`, `open`. Idempotent. Live-tested start, second start, stop."}
      - {name: Initial machine check, status: review, pr: 87, where: "benchctl/machine.py, scripts/check-machine.sh",
         how: "`./scripts/check-machine.sh` (system python3 only, runs before any build) checks OS, cores, RAM, disk, cgroup v2, Docker daemon and compose, free ports, optional tools, and which profiles fit; READY or NOT READY with a fix per problem. Also `benchctl check`."}
      - {name: benchctl doctor / status / diag, status: done, pr: 26, where: "benchctl/checks.py, benchctl/diag.py",
         how: "Environment checks with fixes, governor state, a masked diagnostics tarball, and the container security check."}
      - {name: Observability stack, status: done, where: compose/observability.yml,
         how: "Prometheus (2 d, tmpfs), Grafana with provisioned dashboard, fake GPU exporter (its own image with pyyaml==6.0.3 baked in, no pip at start, runs as nobody; issue 235)."}
      - {name: Declared storage and a shared scratch (issue 461, ADR 0078), status: review, where: "benchctl/storage.py, benchctl/hwinventory.py, benchctl/compose.py, benchctl/scenario.py, components/gpu-exporter-farm/exporter.py, images/node-base/fakefs.py, images/node-base/entrypoint.sh, scenarios/disk-full.yaml, scenarios/quota-exceeded.yaml, scenarios/stale-mount.yaml, tests/test_storage.py, tests/real/test_storage_real.py, docs/guides/storage.md",
         how: "A storage: section in sim.yaml (built-in /home NFS and /scratch Lustre without it) declares mounts with kind, size, fill, inodes and per-user quotas. The GPU exporter turns them into per-node node_filesystem_* series (size, free, avail, files, files_free, device_error) in place of the random one, and serves GET /sim/storage; df and lfs shims in node-base print them in GNU and Lustre layout, including df -i, lfs df and lfs quota -u. A mount marked shared is one real Docker volume (or a host_path bind) on every Slurm and login node with a directory per user, so datasets and job output are shared. Scenarios disk-full, quota-exceeded and stale-mount (SC-41 to SC-43, storage.mount expectation); benchctl remove storage-state. SPEC C-11 changed (owner approved). Unit-tested; the live run (verify.sh --unit storage) is not done. Not built: tier 3, the S3 object store (survey and choice pending in the ADR)."}
      - {name: Typed GPU shapes, MIG-style GRES per slice (issue 546, ADR 0075), status: review, where: "benchctl/mig.py, benchctl/slurmconf.py, images/slurm-ctl/alloc_feed.py, tests/test_mig.py, tests/real/test_mig_real.py",
         how: "Optional sim.yaml gpu.mig (nodes, profile, slices; off by default): the listed nodes advertise gpu:h200_1g:<GPUs x slices> with one stand-in device file per slice, jobs ask --gres=gpu:h200_1g:N, the inventory carries gpu_mig, and the allocation feed maps a slice to its physical GPU so the exporter shows the right GPUs busy. Owner decision: GPU metrics and the node health check stay per physical GPU. Not done: the live run (verify.sh --unit mig), per-slice metrics."}
      - {name: Job usage and Slurm's own metrics (issue 459, ADR 0074), status: review, where: "benchctl/slurmconf.py, benchctl/promtargets.py, observability/dashboards/slurm-overview.json, tests/real/test_slurm_metrics_real.py",
         how: "jobacct_gather/linux so sstat and sacct have usage, and MetricsType=metrics/openmetrics so slurmctld serves /metrics/jobs, nodes, partitions and scheduler on 6817 (the plugin is in the pinned build; no new process). Four scrape jobs, a provisioned slurm-overview dashboard with no threshold colours, and the NodeDrained alert rule (seven rules). Not done: the live runs (verify.sh --unit slurm_metrics), a measured memory cost."}
      - {name: Prometheus targets generated from the selection (issue 458, ADR 0073), status: review, where: "benchctl/promtargets.py, observability/prometheus.yml, components/gpu-exporter-farm/exporter.py, tests/test_promtargets.py, tests/real/test_prom_targets_real.py",
         how: "One target per simulated node (the farm serves /metrics?node=NAME; a powered-off node answers 503) so up and instance are per node, and one scrape job per selected part (real DCGM, real GPU, Kubernetes API server, etcd, scheduler, controller manager, KWOK, Teleport), written by benchctl up into compose/generated/prometheus and reloaded with SIGHUP. The API server job reads only the metrics user's token. Not done: the live runs (verify.sh --unit prom_targets, test_k8s_real, test_teleport_real), Slurm metrics (issue 459)."}
      - {name: Alertmanager and default alert rules (issue 460, ADR 0072), status: review, where: "observability/alertmanager.yml, observability/rules.yml, tests/rules/rules_test.yml, components/jira-mock/jira.py, tests/real/test_alerting_real.py",
         how: "Alertmanager is a core service beside Prometheus (class P1, 127.0.0.1:9093, 64 MB limit). Six rules (GpuXidCritical, GpuTempHigh, InfinibandPortDown, NodeDrained, NodeDown, ExporterDown, JiraErrors), each with a promtool test case; every alert goes to the Jira mock POST /sim/alerts, which opens one ticket per alert and comments on repeat and resolve. The mock also serves GET /metrics (never counted as client traffic) for JiraErrors. In the page: Connections row, a Prometheus to Alertmanager link, a box in the circuit services row. Not done: NodeDrained (needs Slurm metrics, issue 459), a measured memory figure (20 MB is an estimate), the live run (./scripts/verify.sh --unit alerting)."}
      - {name: Optional object store, Garage S3 (issue 672, ADR 0078 tier 3), status: review, where: "benchctl/objectstore.py, benchctl/compose.py, benchctl/promtargets.py, images/node-base/Dockerfile, images/node-base/objectstore.sh, tests/test_objectstore.py, tests/real/test_objectstore_real.py, docs/guides/storage.md",
         how: "benchctl up --with objectstore adds one Garage v2.5.0 container (unprivileged, class P6, 384 MB limit, localhost port 3900, never in --addons or all). Key pair, RPC secret and metrics token are generated once in compose/generated/secrets/objectstore (mode 600, never printed); every Slurm and login node mounts s3.env read-only and has s5cmd v2.3.0 (pinned, SHA256 checked) so a file put on one node is read on another. Prometheus scrapes it (job objectstore, garage_local_disk_avail). Unit-tested; the live run (verify.sh --unit objectstore) is not done. Not built: its box on the architecture and traffic diagrams."}
      - {name: Decisions as ADRs, status: done, where: docs/adr,
         how: "0001 record decisions, 0002 Slurm from source with no extra privileges, 0003 slurmrestd/JWT and accounting, 0004 slurmrestd keeps its unshare steps disabled, 0011 SSH login node."}
      - {name: Getting-started guide, status: done, pr: 52, where: docs/guides/getting-started.md,
         how: "Step-by-step use of the app; tests/test_docs.py fails if a documented command disappears."}
      - {name: User manual, status: review, where: docs/manual,
         how: "Ten chapters with screenshots of the web page and real terminal output (concepts, install, using the cluster, nodes and shells, web page, scenarios, governor, configuration, troubleshooting, reference). Commands were run against a live min stack; tests/test_docs.py checks that every command, script and node name it uses exists. The guide gained a step for getting a shell on a node (docker exec; nodes have no sshd)."}
      - {name: Export with every login node, Teleport on its own address, status: review, where: "benchctl/export.py, benchctl/teleport.py, benchctl/compose.py, webui/connections.py", how: "The client profile has one cluster entry per login node with its own auth (private-key, or a teleport block); the Teleport proxy is reached at its fixed private IP 10.141.255.30:3080 and the name teleport.workbench.test (container alias, optional /etc/hosts line), 127.0.0.1:3080 only a fallback. A Teleport route is the node name plus {proxy, user, insecure}, checked against the client's own importer. Unit-tested; live in tests/real/test_teleport_real.py. Issues 198, 199. A login node nothing answers for is drawn dashed; `up` forgets Teleport nodes and certificates the workbench no longer has (issue 205). Teleport's CA, users and passwords are saved on down/up/invite and restored into an empty data directory of the same version, so a rebuild is the same cluster (issue 223)."}
      - {name: Login nodes with their own auth, status: review, where: "benchctl/logins.py, benchctl/compose.py, images/login/login.sh, webui/connections.py", how: "sim.yaml login: / --login ssh,teleport,both defines 1 to 8 login nodes (login, login2, ...); ssh = key login on a published port, teleport = no port and no key login, both; only Teleport logins are registered in Teleport; sheet row, Connections rows, client profile uses a key login (ADR 0023). Unit-tested; live access matrix in tests/real/test_teleport_real.py. Issue 189."}
      - {name: Controller node and jump host, status: review, where: "benchctl/controller.py, benchctl/compose.py, images/jump, images/node-base/entrypoint.sh, images/login/login.sh, webui/graph.py, webui/static/index.html, webui/comms.py, webui/connections.py, docs/adr/0036-controller-node-and-jump-host.md", how: "Controller (sim.yaml controller.enabled, --controller, the sheet): the slurmctld container also runs sshd for whitelisted users and groups, is the BCM head node (cmsh moves there from the login nodes); without it the login node acts as one. Jump host (part jump, --access jump): a bare sshd bastion on 10.141.255.5 and 127.0.0.1:2220 for ssh -J to key-login nodes and the controller; Teleport nodes keep Teleport. Issues 415, 416. In the graph model, Traffic diagram and Connections. The client export adds a -jump entry per key-login node (jumpHost block, no secret). With Teleport on, the controller is a Teleport node `controller` (host certificate also names slurmctld; `benchctl up` reloads its sshd once Teleport is ready; the whitelist still applies). The Infrastructure drawing has a Jump host and a Controller box in the Access row with their lines (issue 420). Live access and Teleport checks pass (verify.sh --unit access, --unit teleport); the jump host is measured at 1.9 MB."}
      - {name: Real DCGM exporter (opt-in), status: review, where: "benchctl/dcgm.py, components/dcgm-exporter, components/gpu-exporter-farm/exporter.py, compose/observability.yml, docs/adr/0025-slurm-is-real-the-rest-is-simulated.md", how: "Part dcgm (--with dcgm, by name only, P6, 256 MB cap, measured 125 MB): the official dcgm-exporter on NVIDIA's mock NVML (pinned commit built in the image, no driver) serves genuine DCGM series for the first GPU node on 127.0.0.1:9402. The hand-written farm stays the default for every node and writes the override file the mock re-reads (Slurm allocations, XID on GPU 0, temperature). Spike and decision in ADR 0025; SPEC C-22. Issues 231, 426. On the page: a DCGM (real) box and line in the Infrastructure diagram, dcgm-exporter in the Traffic & Communication diagram (port 9402, declared, no counter), a Connections row; the dashed hop lines under the Access row got more room. Issue 435: --dcgm-nodes N (1 to 8) gives the first N GPU nodes an exporter each (ports 9402, 9410...), a scenario clear restarts the exporter, a powered-off node stops it (dcgm scenario steps, Docker only), h200 shows its own model name. Unit-tested and checked in headless Chromium; the live test (verify.sh --unit dcgm --clean) is for the owner to run."}
      - {name: Real GPU (opt-in, exporter and Slurm node), status: review, where: "benchctl/real_gpu.py, components/dcgm-exporter, benchctl/compose.py, benchctl/stack.py, webui/cluster.py, webui/comms.py, webui/connections.py, webui/static/index.html, docs/adr/0037-real-gpu-passthrough.md", how: "Part real-gpu (--with real-gpu, by name only, P6, 640 MB cap, measured 481 MB): the host's own NVIDIA card as the CDI device nvidia.com/gpu=all (unprivileged) with the real dcgm-exporter on 127.0.0.1:9403, Hostname rgpu001; refused with one message when there is no card, driver or CDI spec. On the page: a GPU card box, a Traffic link, a Connections row. SPEC C-23, ADR 0037, issue 428. Slice 2: a Slurm node rgpu001 on the card (a mode of the part) with its own partition real-gpu, GRES type from the card's model, /dev/nvidia0; not in the BMC or BCM mocks yet (issue 431); CUDA is issue 430. Unit-tested, page checked in headless Chromium; the live test (verify.sh --unit real_gpu --clean) is for the owner to run."}
      - {name: Architecture as the main view, status: review, where: "webui/static/index.html, webui/cluster.py", how: "The Infrastructure architecture draws every login node with its way in, the Teleport proxy, the services and the nodes, each line labelled direct SSH, Teleport or jump host; hover tip and click pop-up on every part; the node list folds away; the options sheet survives a backend without logins (ADR 0024). Unit-tested; layout, tip, pop-up and fold checked in headless Chromium (ui_shots.py). Issue 192."}
      - {name: GUI access registry in Connections, status: review, where: "webui/connections.py, webui/static/index.html, tests/test_connections_actions.py", how: "Each Connections row has actions built on the host (link to a localhost web page, copy of a command, ssh:// uri for a direct login), rendered in an Open column; schemes http, https, ssh only, no secret in a value, validated by valid_action and a unit test. The node panel copies benchctl ssh USER@NODE. API links say they open JSON, Copy comes before the ssh:// action, which says it needs a handler (issues 280, 281). Step 1 of the GUI-access plan; benchctl open terminal, the Jira Cloud link and the optional webterm are later steps. Issue 273."}
      - {name: Real Jira Data Center as an optional part, status: review, where: "benchctl/jira_real.py, benchctl/jira_driver.py, benchctl/ticketbot.py, benchctl/compose.py, benchctl/workbench.py, benchctl/cli.py, webui/connections.py, docs/adr/0026-real-jira-data-center-as-an-optional-part.md, docs/guides/jira-real.md, tests/test_jira_dc.py, tests/test_jira_driver_dc.py, tests/test_ticketbot.py, benchctl/jira_proxy.py, tests/test_jira_proxy.py, tests/real/test_jira_dc_real.py", how: "The official Jira Data Center image with Postgres, off by default (never in --addons or all), 127.0.0.1:8083, 3 GB, class P6, next to jira-mock. benchctl setup jira-real finishes the wizard, seeds users alice to erin, project OPS, tickets and personal access tokens (localhost only, generated passwords, nothing printed); the 3-hour Atlassian test licence is a gitignored file; benchctl remove jira-real-state starts over. Data Center only, not Cloud. The setup flow is unit-tested against a fake Jira; the live round trip test needs the licence and was not run in CI. Stage 2 (built, unit-tested against the mock and a Data Center shaped fake, live test needs the licence): the ticket driver runs the same on jira-mock and the real Jira (status categories instead of names, /search without search/jql, project issue types, real user names), and `benchctl run ticket-team|ticket-watch --target mock|real` (benchctl/ticketbot.py) is the host-side team and node watcher, reusing node_watch's parsing. Issue 284, ADR 0026. The 3-hour key counts from the start of Jira (measured: restart moved the end by 65 min): `benchctl refresh jira-real-licence` restarts it, and a Connections button asks the governor to do the same, and the web page detects the licence end (shown in Connections and `benchctl status`) and renews it automatically under 15 minutes left (WORKBENCH_JIRA_AUTO_REFRESH, 0 = off, webui/licence.py; issue 293). The Infrastructure architecture draws a Jira DC box (up/down from /status, no request counter) when the part is built, with a colour legend: kind (simulated violet dashed stripe, real blue solid stripe), state (border), and combinable overlays for traffic and faults (issue 297)."}
      - {name: Phone menu fits the screen, status: review, where: "webui/static/index.html, scripts/ui_shots.py, tests/test_phone_menu.py", how: "The phone rule for the top menu now beats the later desktop rule (it stayed right-anchored and ran off the screen), scrolls when the phone is short, and is guarded by a static test and the chromium check. ui_shots draws the sample nodes before the node-list fold check, so a stopped stack no longer fails it; the faulted-cluster live test opens the node list that a 1280 px window folds by default. Issue 182."}
      - {name: "benchctl ssh [USER@]NODE", status: review, where: "benchctl/nodeshell.py, benchctl/cli.py, tests/test_node_ssh.py, tests/real/test_node_ssh_real.py", how: "benchctl ssh cn001 is a root shell (docker exec); benchctl ssh alice@cn001 is a real SSH login with the generated key through the first key-login node (a ProxyCommand); a command after -- runs instead of a shell. One plain message for an unknown node, an unknown user, a stopped cluster or a Teleport-only cluster. Runs on the host, never from the page (W-3). Issue 275."}
      - {name: benchctl start names what it starts, status: review, where: "benchctl/workbench.py, benchctl/cli.py, scripts/benchctl-launch, tests/test_start_line.py", how: "start prints one first line: the preset or default-plus-parts it starts and, when a workbench was saved by up or apply, either keeps it (nothing chosen: `start --saved` in the launcher rebuilds it from compose/generated/workbench.yaml, issue 387) or names the counts and parts a preset or parts replace (start --profile min is the plain default). Guides updated. Issues 215, 387."}
      - {name: Teleport and Infrastructure architecture in the page, status: review, where: "webui/static/index.html, webui/cluster.py, webui/flow.py, webui/connections.py", how: "The diagram is renamed Infrastructure architecture; Teleport is a service box and list card when built (status from its diagnostics /healthz), dots from teleport_connect_to_node_attempts_total, a Connections row, part toggle in Cluster architecture (ADR 0022). Issue 187."}
      - {name: Measured memory plan and 4 GB app reserve, status: review, where: "benchctl/memory.py, benchctl/workbench.py, benchctl/stack.py, benchctl/machine.py, benchctl/cli.py, profiles/*.yaml, tests/test_memory.py, docs/architecture/04-memory-and-profiles.md", how: "plan, up and the pre-flight admit against measured use plus 15 percent (never above the cap) instead of the container caps (5.1 to 5.8 GB planned for a selection that used 3.0 GiB); plan prints expected and cap per item, a test fails when a component has no measurement; the app under test is a 4 GB reserve in the plan (--app-mb 0 or WORKBENCH_APP_MB=0 when it already runs); profile budgets are the expected use of what is built today. The real Jira limit went from 3072 to 2560 MB (heap 768 MB): the smallest that passed setup and a ticket run, 2304 MB was killed once. Measured live 2026-11-05; user guide docs/guides/memory.md. Issue 287."}
      - {name: Measure the app-under-test reserve, status: review, where: "benchctl/measure.py, benchctl/memory.py, benchctl/machine.py, benchctl/workbench.py, benchctl/cli.py, tests/test_measure_app.py, docs/guides/memory.md, docs/adr/0027-plan-against-measured-memory-not-caps.md", how: "`benchctl measure app --match NAME|--pid N [--duration S] [--save]` sums the PSS of the app's processes, prints peak, typical and a suggested reserve (peak + 10%, up to 100 MB); --save writes compose/generated/app_reserve.json (gitignored). Precedence: --app-mb, WORKBENCH_APP_MB, saved measurement, 4096. The plan and refusal text say given, measured on DATE or assumed. The default reserve is 1024 MB (was a 4096 MB guess), from one measured session: a desktop client with one cluster, a terminal and the real Jira peaked at 664 MB (469 MB idle) under the new client-stress scenario (scenarios/client-stress.yaml); measure app prints which programs matched and warns on a loose --match. Unit-tested with a fake process table; run once against the real client. Not exercised: several clusters or terminals; the Jira faults hit the mock, not the real Jira (issue 303). Issue 301."}
      - {name: Confluence page search on the Jira mock, status: review, where: "components/jira-mock/jira.py, tests/test_jira_pages.py, docs/guides/jira-tickets.md, docs/adr/0005-bcm-and-jira-mock-surface.md", how: "GET /rest/api/search and /wiki/rest/api/search with a CQL subset (type, label, title, text, space, lastmodified; AND OR NOT, ~, in, ORDER BY), start/limit paging with _links.base and next, seven seeded runbook pages, GET|POST /sim/pages to add, clear or reset, the Jira failure modes apply. The query class is shared with JQL. Checked by running the monitoring client's own Confluence client against it (Data Center and Cloud paths). Plugin trimming of the real Jira was measured and does not save memory; a trimmed JVM (Serial GC, C1-only, 512 KB stacks) does: the real Jira cap went from 2560 to 2176 MB, two clean runs (docs/guides/jira-real.md). Issue 289."}
      - {name: Parts by category, status: review, where: "benchctl/workbench.py (CATEGORIES), benchctl/cli.py, benchctl/completion.py", how: "--workload/--accounting/--monitoring/--ticketing/--hardware/--access/--simulation and --addons on start, up, apply, plan; one registry drives flags, Tab completion, errors and the sheet's grouping (ADR 0021). Issue 184."}
      - {name: Real QOS, multifactor priority and preemption from sim.yaml (config lab A-6, A-7), status: review, where: "benchctl/qos.py, benchctl/slurmconf.py, benchctl/compose.py, benchctl/stack.py, benchctl/workload.py, benchctl/scenario.py, scenarios/preempt-burst.yaml, tests/test_qos.py, tests/real/test_qos_real.py, docs/guides/qos-and-preemption.md, docs/adr/0055-real-qos-priority-and-preemption-from-sim-yaml.md",
         how: "Optional sim.yaml qos: (priority, max_gpus_per_user, grace_time_s, preempt) and slurm.priority: become real QOS objects in slurmdbd through accounting.sh, PriorityType=priority/multifactor and PreemptType=preempt/qos with REQUEUE; refused with one message without the accounting part; submit steps take qos:. Scenario preempt-burst (SC-37). Unit-tested; live test result in the PR; the monitoring client not exercised. Issue 544."}
      - {name: Slurm topology from sim.yaml and a switch-down scenario (config lab A-5), status: review, where: "benchctl/topology.py, benchctl/slurmconf.py, benchctl/compose.py, benchctl/stack.py, benchctl/scenario.py, scenarios/switch-leaf-down.yaml, tests/test_topology.py, tests/real/test_topology_real.py, docs/guides/topology.md, docs/adr/0053-slurm-topology-from-sim-yaml.md",
         how: "Optional sim.yaml topology: (tree or block, spines, leaves_per_spine) writes topology.conf beside slurm.conf plus TopologyPlugin; nodes of the inventory are spread round-robin over leaves; a bad setting is refused by up with one message; a changed file restarts slurmctld. Scenario target switch (SC-35): down drains exactly one leaf's nodes, up resumes exactly those; the page plays it through the governor. Unit-tested (file text, agreement with the inventory, the exact drain and resume commands); the live test (scontrol show topology equals sim.yaml, drain and resume) is written, not run; block plugin, --switches placement and the monitoring client not exercised. Issue 543."}
      - {name: Expiry and auth faults in the scenario engine (config lab A-15), status: review, where: "benchctl/authfaults.py, benchctl/scenario.py, components/bmc-farm/bmc.py, components/bmc-farm/gen_cert.py, scenarios/auth-*.yaml, scenarios/bmc-tls-expired.yaml, scenarios/k8s-cert-expired.yaml, tests/test_authfaults.py, tests/real/test_authfaults_real.py, docs/adr/0052-expiry-and-auth-faults-in-the-scenario-engine.md, docs/guides/client-testing.md",
         how: "Target auth with five faults (SC-30 to SC-34): a Slurm JWT with a short life saved to compose/generated/secrets/slurm_token, a Teleport identity re-signed with a short ttl, a wrong munge key on one node (own key kept in the node and put back), the BMC farm presenting an expired certificate (POST /sim/tls, same key and name), the API server restarted with an expired serving certificate from the same CA. Unit tests include a real openssl date check. The live test (BMC, munge, token) is written, not run; the Teleport and Kubernetes steps and slurmrestd's 401 need their parts running and are not covered live. Issue 549."}
      - {name: One generated node inventory and one GPU node shape (review 6.1), status: review, where: "benchctl/hwinventory.py, benchctl/compose.py, benchctl/slurmconf.py, components/bmc-farm/bmc.py, components/bcm-mock/bcm.py, components/gpu-exporter-farm/exporter.py, observability/gen_targets.py, sim.yaml, tests/test_inventory_shapes.py, tests/invhelp.py, tests/real/test_inventory_real.py, docs/adr/0051-one-generated-node-inventory.md, SPEC.md section 3",
         how: "benchctl up writes compose/generated/inventory.json (names, kinds, CPUs, memory, GPUs, serials, GPU UUIDs) and mounts it into the BMC farm, BCM mock and GPU exporter; none of them parses sim.yaml, and the BMC and BCM images lose pyyaml. A GPU node is 64 CPUs and 16384 MB (sim.yaml gpu.cpus and gpu.memory_mb) in Slurm, Redfish and BCM; Slurm was 8 and 4096. A unit test compares the four node by node; the live test is written, not run. Needs benchctl up on an existing cluster (mounts changed). Issue 462."}
      - {name: Slurm keys made at up, not baked into the image (review SEC1, issue 465), status: review, where: "benchctl/stack.py (ensure_slurm_keys), benchctl/compose.py (SLURM_KEYS_MOUNT), images/node-base/entrypoint.sh, images/node-base/Dockerfile, tests/test_slurmkeys.py, tests/real/test_slurmkeys_real.py",
         how: "The munge and JWT keys are generated once into compose/generated/secrets/slurm and mounted read-only into every node-base, slurm-ctl and login container; the entrypoint installs them with the right owners and refuses to start without them. No key material in any image layer (ADR 0003 addendum). Unit tests pass; the live test (image layers, key equality in containers, munge and token) is written, not run."}
      - {name: Hermetic unit tests and a CI workflow (review 6.8, part of 473), status: review, where: "tests/conftest.py, tests/hostbin/, tests/test_hermetic_guard.py, tests/real/test_compose_real.py, .github/workflows/ci.yml, CLAUDE.md",
         how: "An autouse guard keeps unit tests from running host tools: docker, virsh and ssh-keygen have stand-ins in tests/hostbin (24 tests ran docker or ssh-keygen for real before), systemctl, systemd-run, kubectl, tc, nsenter, tcpdump and sudo raise. The docker compose config check moved to tests/real. A CI workflow runs ruff, the privacy scan, the unit tests, the page logic tests and the tracker check on every PR. Removing the scenario-engine catalog entry and the empty component folders waits for an owner decision. Issue 473."}
      - {name: Slurm power save and reboot through the BMC farm (config lab A-8, A-9), status: review, where: "images/slurm-ctl/power.sh, images/node-base/reboot.sh, benchctl/slurmconf.py, benchctl/scenario.py, scenarios/reboot-asap.yaml, tests/test_power_reboot.py, tests/real/test_power_real.py, docs/guides/power-and-reboot.md, docs/adr/0054-slurm-power-save-and-reboot-through-the-bmc-farm.md, SPEC.md C-1",
         how: "slurm.conf gets SuspendProgram, ResumeProgram and RebootProgram: power.sh (one script, two names) resets the node's BMC in bmc-farm and tells the BCM mock and the GPU exporter; reboot.sh power-cycles through the BMC and restarts slurmd with the existing hold file. Scenario steps power_down, power_up, reboot on target slurm and the scenario reboot-asap (SC-36). Unit tests run the scripts against stand-in scontrol and python3. The live test is written, not run; open until it is: scontrol power down with SuspendTime unset, the POWERED_DOWN text, re-registration after power up, how a reboot is seen to finish. Not run against the monitoring client. Issue 545."}
      - {name: "Config lab, scope, overlay model and A/B method (goal G6, epic 557)", status: todo, where: "SPEC.md G6 C-24 W-17l NF-9, docs/adr/0049-config-lab-scope-and-overlay-model.md, docs/adr/0050-config-lab-ab-replay-method.md",
         how: "Decisions recorded, nothing built: the lab is a mode of the running cluster with an overlay model, governor lab-* commands in user mode at L0-L1, rules before Alertmanager, a downscaled and time-dilated A/B replay with a rule-based verdict. Children: issues 543 to 556 and the reused 458 to 462, 465, 473, 221. Issue 542."}
      - {name: Verification helpers, status: done, pr: 48, where: "scripts/verify.sh, scripts/impact.py, tests/real/impact.yaml, tests/real/stack_reuse.py, docs/adr/0057-two-verification-gates-and-impact-selected-live-tests.md",
         how: "verify.sh runs validate.sh plus real tests (--full adds the live stack lifecycle); tests/real/helpers.py starts a live governor and talks to its socket. `--unit NAME [--clean]` verifies one component (tests/test_NAME*.py then tests/real/test_NAME*.py, optional reset hook scripts/verify.d/NAME.sh; --list-units, -n). Issue 180. Issue 237: seconds per step and a TIME line; validate.sh writes a pass stamp (scripts/lib-stamp.sh, keyed by HEAD, tracked diff, untracked files and COV_FLOOR) so verify.sh skips a second run on the same tree (`--revalidate` forces it); pytest markers `live` and `browser`, `--skip-browser`. Issue 236: WORKBENCH_TEST_TIMERS=1 (opt-in, read by the slurm.conf generator) shortens SlurmdTimeout and HealthCheckInterval for the slow live modules via the test_timers fixture; the default timings stay checked in test_stack_real. Issue 576 (ADR 0057, 0058): `--changed` picks live modules from tests/real/impact.yaml (scripts/impact.py, unmatched path = everything), validate.sh runs beside the live tests (`--serial`, `--trust-ci`), fail-fast for --changed, per-module timing (compose/generated/verify-times.json, SLOW line), real Jira only with `--with-jira`, stack keys with STACK_REUSE, image build stamps (WORKBENCH_FORCE_BUILD), `--install-nightly` user timer."}
      - {name: Progress tracker, status: done, pr: 42, where: benchctl/progress.py,
         how: "This page, generated from docs/progress.yaml (issue 19)."}

architecture:
  groups:
    - {id: host, title: "Host (root, outside every container)"}
    - {id: net, title: "Docker network (sim containers, no privileges)"}
    - {id: ext, title: "Outside the 16 GB budget"}
  nodes:
    - {id: benchctl, group: host, label: "benchctl CLI", status: partial}
    - {id: gov, group: host, label: "Governor (ladder + watchdog)", status: done}
    - {id: sock, group: host, label: "gov.sock", status: done}
    - {id: docker, group: host, label: "Docker + cgroups", status: done}
    - {id: libvirt, group: host, label: "libvirt VMs", status: partial}
    - {id: ctld, group: net, label: "slurmctld", status: done}
    - {id: slurmd, group: net, label: "slurmd x N (fake GPUs)", status: done}
    - {id: restd, group: net, label: "slurmrestd (JWT)", status: done}
    - {id: dbd, group: net, label: "slurmdbd", status: done}
    - {id: maria, group: net, label: "MariaDB (tmpfs)", status: done}
    - {id: prom, group: net, label: "Prometheus", status: done}
    - {id: graf, group: net, label: "Grafana", status: done}
    - {id: alertm, group: net, label: "Alertmanager", status: partial}
    - {id: gpux, group: net, label: "gpu-exporter-farm", status: done}
    - {id: bmc, group: net, label: "bmc-farm", status: done}
    - {id: bcm, group: net, label: "bcm-mock", status: partial}
    - {id: jira, group: net, label: "jira-mock", status: partial}
    - {id: login, group: net, label: "login node (sshd)", status: done}
    - {id: tele, group: net, label: "Teleport access", status: partial}
    - {id: chaos, group: net, label: "scenario engine (benchctl)", status: partial}
