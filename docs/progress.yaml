# Single source of truth for docs/PROGRESS.md and docs/progress.html.
# Regenerate with: python -m benchctl.progress   (validate.sh fails if the outputs are stale)
# status: done = merged and verified | review = in an open PR | partial = some of it works | todo = not started
# `where` paths are checked to exist for done/partial items.
updated: 2026-11-01
repo: https://github.com/AhmedYousriSobhi/workbench
# PR numbers up to this belong to the previous repository (before the move) and are shown without links.
legacy_pr_max: 160

phases:
  - id: p0
    title: Baseline
    goal: Measure real memory so budgets stop being guesses
    items:
      - {name: Measurement tooling, status: done, pr: 28, where: benchctl/measure.py,
         how: "`benchctl measure run/report` samples host, Docker containers, PSS per process and libvirt domains (read-only), saves JSON, suggests budgets = peak x 1.2. `benchctl measure cgroup` reads a container's memory.stat (shmem, file, anon) and OOM-kill count (issue 455)."}
      - {name: Host baseline, status: partial,
         how: "Idle host and a small Slurm stack were measured (slurmd 5 MiB, slurmctld 13, MariaDB 171). No loaded run with mocks yet."}
      - {name: Budgets replaced by measured values, status: partial, pr: 68, where: profiles/min.yaml,
         how: "Per-component working sets measured live on 2026-11-05 (benchctl/memory.py MEASURED_MB; the plan expects measured + 15 percent, never above the cap, issue 287); profile budgets are those component figures summed (min 0.5 GB, std 1.2, full 1.8, jira-real 3.5, tested in tests/test_memory.py); whole-profile peaks are measured for min only. Docker's own memory (containerd-shims, dockerd) is measured with `benchctl measure overhead --save` and added by the plan (issue 456); per-node parts declare a cost in PER_NODE_MB, tested."}

  - id: p1
    title: Governor
    goal: A root service that keeps the host alive by escalating through a ladder
    items:
      - {name: Signals and escalation ladder, status: done, pr: 14, where: "governor/signals.py, governor/ladder.py",
         how: "MemAvailable, PSI and swap rate feed levels L0-L5. Escalates at once, steps down one level per 60 s calm with a 10 s dwell. L4 from a PSI stall needs 5 s (ADR 0032, issue 286); low MemAvailable is immediate."}
      - {name: Priority planner, status: done, pr: 14, where: governor/planner.py,
         how: "P0-P6 classes; lowest priority first, reversible actions before destructive ones; undo on de-escalation."}
      - {name: Executors, status: done, pr: 20, where: governor/executors.py,
         how: "freeze, throttle (memory.high), reclaim, stop (cgroup.kill then docker stop), managedsave for VMs, via cgroup files opened in advance."}
      - {name: mlockall and pre-allocated mitigation path, status: done, pr: 19, where: governor/memlock.py,
         how: "Locks its own pages and pre-opens handles and buffers so L3/L4 performs no allocation (SPEC GV-8)."}
      - {name: Control socket, status: done, pr: 19, where: governor/control.py,
         how: "JSON lines on /run/workbench/gov.sock with a fixed allow-list; unknown commands are rejected."}
      - {name: NF-1 memory-hog test, status: done, pr: 24, where: tests/real/test_root.py,
         how: "A real container hog is throttled, frozen then stopped in order; no host OOM. Runs as root via scripts/real-test-root.sh."}
      - {name: Security watchdog, status: done, pr: 34, where: governor/watchdog.py,
         how: "Every 15 s flags privileged/capability/unconfined/host-namespace/docker.sock containers, missing limits and live memory.max drift. Report only; skipped from L3 up."}
      - {name: Monitored slurmrestd exception, status: done, pr: 44, where: governor/watchdog.py,
         how: "slurmrestd runs with two unshare steps disabled (ADR 0004). Any wider SLURMRESTD_SECURITY option is a violation; doctor lists the accepted exception."}
      - {name: Inventory refresh and Grafana annotations, status: done, pr: 36, where: "governor/annotate.py, governor/core.py",
         how: "Re-discovers containers so late starters are governed; posts audit events to Grafana with a token from the environment (SPEC GV-6)."}
      - {name: systemd unit installed permanently, status: partial, where: systemd,
         how: "Unit and slice pass systemd-analyze and ran as a transient service in tests; scripts/install-governor.sh installs it as the standing service (printed unit tested; the sudo install itself is run by the user)."}
      - {name: Admission and real scale / set-profile, status: done, pr: 48, where: governor/core.py,
         how: "admit command (GV-9): refused at L2+ or if it would breach the floor; scale and set-profile run benchctl in the background at L0-L1 only (GV-8). benchctl up/scale ask first. Verified live through the socket."}
      - {name: "Swap storm, memory.events and compressed swap signals (issue 463)", status: done, where: "governor/signals.py, governor/ladder.py, governor/core.py, governor/metrics.py, docs/adr/0059-governor-signal-model.md",
         how: "Sustained pswpout adds one level (up to L3); per-container memory.events high/oom/oom_kill in status and /metrics, oom_kill an audit event; zswap and zram pools taken off MemAvailable. Unit tests with the signals file; live in test_pressure_real."}
      - {name: "PSI trigger, pre-opened signal files, thresholds from sim.yaml (issue 464)", status: done, where: "governor/psi.py, governor/hostsize.py, governor/signals.py, governor/__main__.py, docs/adr/0059-governor-signal-model.md",
         how: "A kernel PSI trigger (2 s window, works as a normal user) wakes the loop early, polling fallback with the reason logged; /proc files opened once and read with preadv; L1/L4/calm memory thresholds and the admission floor derive from host.reserve_gb and safety_floor_gb. Latency gain not measured."}
      - {name: Governor /metrics endpoint, status: done, pr: 60, where: governor/metrics.py,
         how: "Prometheus text (level, MemAvailable, PSI, swap, groups per priority, actions, admissions) bound to the docker bridge address, rendered once per step so a scrape does no work (GV-8). The Prometheus 'governor' target is up on the live stack."}
      - {name: Live ladder test on the real stack, status: done, pr: 60, where: tests/real/test_pressure_real.py,
         how: "Dry-run governor against the running containers: L0 to L3 and back, /metrics, Grafana annotations and the planned throttle/freeze/thaw actions. The root variant passes on the dev machine: L3 really freezes a live container's cgroup (cgroup.events frozen 1), keeps P1 services running, and thaws on recovery; it also exposed and fixed the nested-slice cgroup path bug (PR 64)."}
      - {name: Host tuning script and benchctl top, status: todo,
         how: "zram, swappiness and THP tuning with confirmation, and a live view of the governor."}

  - id: p2
    title: Slurm
    goal: A real scheduler the app can read, built from sim.yaml
    items:
      - {name: Slurm 26.05.5 images, status: done, pr: 32, where: images/node-base/Dockerfile,
         how: "Built from the SchedMD tarball (pinned and SHA256-checked) because Ubuntu's 23.11 lacks the 2026 security fixes; no extra container privileges (ADR 0002)."}
      - {name: Generated Slurm config, status: done, pr: 32, where: benchctl/slurmconf.py,
         how: "slurm.conf, gres.conf and cgroup.conf derive from sim.yaml so node names match everywhere; fake GPUs use /dev/null-backed device files."}
      - {name: Compose generation, status: done, pr: 30, where: benchctl/compose.py,
         how: "`benchctl compose --profile X` renders services with mem_limit, cgroup_parent and the workbench.class label from sim.yaml and profiles."}
      - {name: slurmrestd with JWT, status: done, pr: 38, where: benchctl/compose.py,
         how: "JWT-only REST on the internal network, own user, no privileges; skips two unshare steps instead of loosening seccomp (ADR 0003, ADR 0004). Verified live: no token 401, bad tokens get no data."}
      - {name: Accounting, status: done, pr: 38, where: benchctl/slurmconf.py,
         how: "MariaDB on a capped tmpfs plus slurmdbd; sacctmgr bootstrap creates cluster, QOS and users from sim.yaml; secrets stay in a gitignored folder. Verified live: a job as alice appears in sacct and the REST slurmdb endpoint."}
      - {name: Real-Slurm decision record, status: review, where: docs/adr/0025-slurm-is-real-the-rest-is-simulated.md,
         how: "One ADR: what is real (scheduler, output, REST auth, node death timing), what is simulated (GPUs, cgroups, jobs), cost and what to cut first; linked from architecture 4.1 and client-testing. Issue 218."}
      - {name: Faster image rebuilds, status: review, where: "images/node-base/Dockerfile, images/login/Dockerfile, images/slurm-ctl/Dockerfile",
         how: "python3 moved into node-base's apt layer; login and slurm-ctl run no apt step, so a node-base change no longer re-installs packages twice: login + slurmctld rebuild 39.9 s before, 0.6 s after (one-time 22 s). Compute nodes carry an unused python3. Issue 225."}
      - {name: Basic Linux tools on every node, status: review, where: "images/node-base/Dockerfile, tests/test_node_tools.py, tests/real/test_node_tools_real.py", how: "node-base's one apt layer adds ping, ip, ss, dig, nc, traceroute, tcpdump, curl, ps, lsof, strace, vi and similar, so nodes, login nodes and the controller can be troubleshot from inside. Issue 441. The live test (verify.sh --unit node_tools) is for the owner to run."}
      - {name: dcgmi on every node, status: review, where: "images/node-base/Dockerfile, images/node-base/dcgmi, benchctl/dcgm.py, benchctl/real_gpu.py, components/dcgm-exporter/start.sh", how: "node-base copies the dcgmi client (5 MB) from the pinned exporter image; the wrapper points it at the node's exporter host engine (WORKBENCH_DCGM_HOST), which listens on the cluster network, so dcgmi discovery -l works on rgpu001 and on the GPU nodes of the dcgm part; other nodes have no engine. Issue 443. Live tests (verify.sh --unit dcgm, real_gpu) are for the owner to run."}
      - {name: benchctl up / down / scale, status: done, pr: 45, where: benchctl/stack.py,
         how: "Pre-flight, staged start (observability, slurm, nodes), skips unbuilt mocks, scale regenerates slurm.conf, Grafana token created once (0600). Verified live with min; scale really stops containers."}

  - id: p3
    title: Mocks
    goal: Fake BMC, BCM and Jira so the app's integrations can be exercised
    items:
      - {name: gpu-exporter-farm, status: done, where: components/gpu-exporter-farm/exporter.py,
         how: "One process serving fake DCGM metrics for every simulated GPU (util, FB used and free, temp, power, XID) with the real exporter labels (Hostname, UUID, modelName), fault injection over /sim/inject. A read-only Grafana token for clients is made by benchctl up. Verified live through Grafana /api/ds/query."}
      - {name: bmc-farm, status: done, pr: 52, where: components/bmc-farm/bmc.py,
         how: "One process serves /<node>/redfish/v1 for every node: Systems, Chassis Thermal/Power, Managers, event log, Reset action, POST /sim/inject (temp, fans, power, events). Also standard Redfish over TLS on 127.0.0.1:8443 (Host picks the node, session login, collections, firmware, accounts; ADR 0012). Verified live in the stack."}
      - {name: bcm-mock, status: partial, pr: 71, where: components/bcm-mock/bcm.py,
         how: "CMDaemon-style POST /json (cmdevice, cmstatus, cmpart) over the sim.yaml nodes, power calls and /sim/inject. Call names are an assumed subset (ADR 0005); verified live, 12 MiB."}
      - {name: Fake cmsh on the login node, status: done, where: images/login/cmsh.py, how: "cmsh -c \"device; list\" / \"device; status\" / category, jobqueue and healthchecks lists on the login node (the BCM head node), state read from bcm-mock so a scenario that takes a node down shows DOWN; mutating commands refused; read-only interactive console with modes (ADR 0013). Verified live: tests/real/test_cmsh_real.py."}
      - {name: jira-mock, status: partial, pr: 71, where: components/jira-mock/jira.py,
         how: "Mode mock only: REST v2/v3 issues, POST search (/search/jql token paging, /search offset paging), myself, serverInfo, field, project, JQL with OR/NOT/parentheses/text search, comments (read, edit, delete), issue edit, watchers, worklog, assign, user search, workflow transitions with required-field errors, JQL subset, webhooks, 429/503/slow failures, and /sim/tickets for scenarios (ADR 0005, issue 107); node faults file one Incident per node and kind (comment on a repeat, resolve on recovery) through the scenario engine's side effects (issue 157); a background team moves, comments, reassigns, reopens and files tickets (GET|POST /sim/activity, JIRA_ACTIVITY_EVERY, `benchctl set jira-activity`, issue 158). Verified live in the container (transitions, JQL, webhook to an outside receiver, 429/503), 15 MiB. cloud/dc modes not built. Contract test (issue 229): scripts/record_jira_shapes.py records real Jira Cloud response shapes (read-only, keys and types only) and tests/test_jira_contract.py fails on drift, gaps listed in tests/fixtures/jira/known-gaps.yaml; tooling built, nothing recorded yet (needs the owner's own Jira Cloud site), docs/guides/jira-contract.md. Ticket driver (issue 262, step 1): benchctl/jira_driver.py does the node-fault, recovery and team-activity actions through the standard REST API instead of /sim/*, verified against the mock; not yet wired to jira.mode, node_watch or scenarios, and not run against real Cloud."}
      - {name: SSH login node, status: done, where: images/login, how: "sshd + Slurm client tools on 127.0.0.1:2222, key login only, forwarding on, keys generated by benchctl up (ADR 0011). Verified live: sinfo over SSH, root and password refused, port forward to a mock."}
      - {name: sshd on compute nodes, status: done, where: images/node-base, how: "sshd in node-base, started on nodes only (WORKBENCH_SSHD): ssh cn001 from the login node with no prompt (cluster key, shared node host key), a client ProxyJump or execution target to a node, srun and srun --pty. Reached through the login node only (ADR 0014). up builds node-base first. Verified live: tests/real/test_node_ssh_real.py."}
      - {name: Client setup by component, status: review, where: docs/guides/client-setup-by-component.md, how: "One section per client component (SSH, Slurm, Grafana, storage, Jira, BCM, BMC): values, where to get them, what to expect, common failure. Values checked against the live stack; not walked in the client window. Issue 82."}
      - {name: Normal shell on nodes, status: review, where: images/node-base/Dockerfile, how: "Simulated users get bash (useradd default), bash-completion, Slurm tab completion from the Slurm source tree, history, a user@node prompt and Slurm on the login-shell PATH. Verified live: tests/real/test_login_real.py. Issue 81."}
      - {name: Client key helper, status: review, where: "benchctl/stack.py, benchctl/cli.py", how: "benchctl ssh-key install|remove: copies the login key to ~/.ssh/workbench_ed25519 (mode 600) for clients that only read keys under ~/.ssh; refuses to overwrite a foreign file. Issue 80."}
      - {name: GPU metrics follow Slurm jobs, status: review, where: "components/gpu-exporter-farm/exporter.py, images/slurm-ctl/alloc_feed.py", how: "slurmctld serves the GPU indexes running jobs hold (internal :9401); the exporter polls it every 3 s and shows those GPUs busy, the rest idle (last answer kept 30 s if the feed is down). Verified live: tests/real/test_gpu_follows_slurm_real.py. Issue 83."}
      - {name: Teleport access, status: review, where: "benchctl/teleport.py, images/node-base/teleport-ssh", how: "Optional part (--with teleport): real Teleport auth+proxy container, agentless OpenSSH nodes trusting its CA, identity file per user, benchctl add invite for tsh login (ADR 0020). Unit-tested; live test tests/real/test_teleport_real.py. `benchctl doctor` and `up` warn in one line when the local tsh is a newer major version than the server (issue 210). Not yet: outage and cert-expiry scenarios, Web UI entry, measured memory budget. Issue 39."}

  - id: p4
    title: People and chaos
    goal: Simulated users and engineers, scripted faults
    items:
      - {name: Scenario files, status: partial, where: scenarios, pr: 73,
         how: "Twelve scenarios: ib-port-down, gpu-xid-storm, node-down, fan-failure, jira-429, jira-outage, jira-flap, ticket-lifecycle, drain-ticket and ticket-wave run now; pod-crashloop and k8s-node-notready need the k8s part."}
      - {name: Slurm resilience scenarios and trace, status: review, where: "scenarios/slurmd-*.yaml, scenarios/slurmctld-restart-mid-job.yaml, scenarios/drain-mid-job.yaml, benchctl/slurmtrace.py, images/node-base/slurmd-run, governor/core.py, webui/app.py, webui/static/index.html, tests/real/test_slurmresilience_real.py, docs/guides/slurm-resilience.md",
         how: "Four scenarios start a real job (and a simulated GPU job) and restart or stop slurmd, restart slurmctld or drain under it; `scenario run NAME --trace` prints job states, slurmstepd pids and the new Slurm log lines per step. slurmd now runs under slurmd-run instead of as PID 1 so it can restart without the container. Steps: submit {node, gpus, duration}, cancel, slurmd_restart|stop|start, slurmctld_restart; expect slurm.job_state, slurm.stepd. The page plays them and shows the trace (tick Slurm trace) through new governor commands slurm-step and slurm-trace (read-only `benchctl get trace`), so W-3 holds; also `benchctl set slurmd|slurmctld`, `remove jobs`. Unit tests run; live test written, NOT yet run (observed behaviour to be recorded). Issue 220."}
      - {name: user-sim and ticket-bot, status: todo, how: "Load is the login node's user_sim.py (benchctl load on|off). The placeholder containers, parts and the ticket-bot scenario target were removed (issue 473, ADR 0006 addendum); personas and a ticket bot are not built and would run on the login node."}
      - {name: scenario-engine, status: partial, pr: 73, where: benchctl/scenario.py,
         how: "`benchctl scenario list|run NAME|SC-nn [--speed N] [--dry-run]` (fixed reference numbers SC-01..., a summary line before a run, issue 303): steps drive bmc-farm, bcm-mock, gpu-exporter, jira-mock, Slurm (scontrol) and the login node's sshd (ssh target: down, hung, up, rotate_host_key, max_sessions, reject_auth, node_sshd + nodes, reset; scenarios ssh-host-key-changed, login-node-down, login-node-hung, ssh-session-limit, ssh-key-refused, ssh-node-sshd-down; tests/real/test_ssh_faults_real.py); ramps; expect (slurm.node_state, jira.issue_created) watched from the start; ticket-bot steps skipped; `k8s` steps (needs the k8s part) run kubectl from the official image. `jira-real` target (issue 303): real faults on the real Jira, outage/restore (docker pause), bad_logins (401 then 403 CAPTCHA), clear_logins, rate_limit/rate_limit_off (Jira's own limiter through its tables, real 429 with X-RateLimit headers, about 40 s reload); scenarios jira-real-outage, jira-real-captcha and jira-real-429, and client-stress-real (the whole client-stress run against the real Jira), verified live. Issues 305-307 (unit-tested; verified live against the real Jira with tests/real/test_jira_dc_real.py, not yet against the client): token_revoke/token_restore (a real 401 for a personal access token, scenario jira-real-token-revoked), proxy_slow/proxy_503/proxy_429/proxy_off through a stdlib fault proxy on 127.0.0.1:8084 (benchctl/jira_proxy.py, scenario jira-real-slow-503, the client must use :8084), and `tickets:` steps plus `target: real` expectations on the real Jira through the REST driver (client-stress-real files its 12 tickets there); ADR 0026 addendum. Runs in the host CLI, not a container (ADR 0006). Verified live."}

  - id: p5
    title: Kubernetes
    goal: Mixed real and fake K8s nodes
    items:
      - {name: Kubernetes policy objects and API throttling, status: review, where: "k8s/fixtures/60-policy.yaml, k8s/scenario/70-apf.yaml, benchctl/k8s.py, benchctl/scenario.py, scenarios/k8s-preempt.yaml, scenarios/k8s-drain-blocked.yaml, scenarios/k8s-api-throttled.yaml, tests/test_k8s.py, tests/real/test_k8s_real.py, docs/adr/0077-k8s-policy-objects-and-api-throttling.md",
         how: "PriorityClasses inference, training and best-effort, a quota of two DRA devices in team-a, an inference deployment with a PodDisruptionBudget that blocks a drain. Scenario steps pod (priority_class, node), drain and remove, expectation k8s.pods_on_node; scenarios k8s-preempt (SC-38), k8s-drain-blocked (SC-39) and k8s-api-throttled (SC-40, an APF level for the viewer user that is applied and removed by the scenario). Unit-tested; the live run (verify.sh --unit k8s) is not done. Issue 548, ADR 0077."}
      - {name: DRA ResourceSlices on the KWOK GPU nodes, status: review, where: "benchctl/dra.py, benchctl/k8s.py, k8s/fixtures/55-dra-claims.yaml, tests/test_k8s.py, tests/real/test_k8s_real.py, docs/adr/0076-dra-resource-slices-on-kwok-gpu-nodes.md",
         how: "A DeviceClass and a resource.k8s.io/v1 ResourceSlice per GPU node (driver gpu.sim.test, attributes uuid, model, index, NVLink domain; memory capacity), generated at up into compose/generated/k8s/50-dra.yaml; the fixture pod dra-train claims one GPU and the real scheduler allocates it. Device UUIDs are the UUID labels of the node's DCGM series. Written and unit-tested; the live run (verify.sh --unit k8s) is not done. Issue 547, ADR 0076."}
      - {name: Cluster fixtures, status: done, where: k8s/fixtures,
         how: "Namespaces, workloads, failure signals and a read-only RBAC role, applied with apply.sh."}
      - {name: Kubernetes part (real control plane plus KWOK nodes), status: done, pr: 379, where: "benchctl/k8s.py, benchctl/compose.py, benchctl/stack.py, benchctl/scenario.py, k8s/kwok, k8s/fixtures, images/login, tests/test_k8s.py, tests/real/test_k8s_real.py, docs/adr/0034-kubernetes-kwok-first.md",
         how: "Optional part (`benchctl up --with k8s` or `--workload kubernetes`, off by default; issue 232, ADR 0034): etcd, kube-apiserver, kube-controller-manager, kube-scheduler and the KWOK controller as five unprivileged, memory-limited compose services at fixed addresses (API 10.141.255.40:6443), P3, measured about 0.3 GB (cap 0.77 GB). Nodes (kcn001..., kgpu001... with nvidia.com/gpu and GPU Feature Discovery labels) come from sim.yaml kubernetes.nodes; a PKI and read-only kubeconfigs are generated into secrets/k8s; the login node has kubectl (from the official image) and per-user ~/.kube/config (cluster-wide) and limited.yaml (namespace team-a), mode 600. Failing pods get a kubelet's status from KWOK stages (label workbench_fault: CrashLoopBackOff, OOMKilled, ImagePullBackOff, failed job). Scenario target k8s (down/up, cordon, pod, delete_pod, scale, apply; expect k8s.node_ready, k8s.pod_status): k8s-node-notready, pod-crashloop. Login nodes can be an s-login (`ssh:slurm`) or a k-login (`ssh:k8s`) (issue 380): the k-login has kubectl and the kubeconfigs and no Slurm configuration; the diagram shows the Kubernetes nodes as their own group, each login pointing at the group it serves; printed ssh commands carry -o IdentitiesOnly=yes. The Cluster architecture sheet is a wide two-column layout (Slurm card, Kubernetes card with its own CPU and GPU node counts, a card per login node with Way in and Serves choices, optional parts, a sticky summary); --k8s-cpu-nodes. The diagram has a Kubernetes API box (up or down, no request counter) and the client export puts the k8s block on the k-login's entry (checked with the client's own importer). Kubernetes nodes are machines: they get BMCs (a rule per node group, --bmc-groups), BCM entries (categories k8s-cpu, k8s-gpu; BCM managing them is an option, `bcm.manage_kubernetes`, `--no-bcm-k8s`, issue 413; with a controller node the BCM head node is the controller, ADR 0036) and GPU metrics. The Scenarios panel is a docked drawer toggled from the top strip. Verified live (verify.sh --unit k8s); the client's screens not yet tried (desktop app). Not built: a real agent node (privileged), metrics-server, Teleport access."}

