name: k8s-mig-single
ref: SC-51
description: the first Kubernetes GPU node becomes a MIG node with strategy single (labels as GPU Feature Discovery publishes them, product H200-MIG-1g.18gb, 7 devices served as nvidia.com/gpu), then a normal GPU node again after 120 s (issue 766)
steps:
  - {at: 0s,   target: k8s, do: {gpu: {node: first k8s gpu node, count: 8, mig: {strategy: single, profile: 1g.18gb, devices: 7}}}}
  - {at: 120s, target: k8s, do: {gpu: {node: first k8s gpu node, count: 8, mig: {strategy: none, profile: 1g.18gb}}}}
expect:
  - k8s.node_gpus: {node: first k8s gpu node, allocatable: 7, within: 20s}
  - k8s.node_gpus: {node: first k8s gpu node, allocatable: 8, after: 125s, within: 20s}
