name: slurmctld-restart-mid-job
description: slurmctld restarts (its container) while a real job and a simulated GPU job run; the nodes keep the work and slurmctld recovers its state (run with --trace)
steps:
  - {at: 0s,  target: slurm, do: {submit: {node: cn001, wrap: "sleep 600"}}}
  - {at: 0s,  target: slurm, do: {submit: {node: gpu001, partition: gpu, gres: "gpu:2", wrap: "sleep 600"}}}
  - {at: 15s, target: slurm, do: {slurmctld_restart: true}}
  - {at: 75s, target: slurm, do: {cancel: true}}
expect:
  - slurm.stepd: {node: cn001, alive: true, within: 14s}
  - slurm.job_state: {node: gpu001, state: RUNNING, within: 14s}
