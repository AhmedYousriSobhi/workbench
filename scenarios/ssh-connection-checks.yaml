name: ssh-connection-checks
description: The login node hangs, goes down, refuses keys and changes its host key, then a node's sshd stops; each recovers
steps:
  - {at: 10s,  target: ssh, do: {login: hang}}
  - {at: 40s,  target: ssh, do: {login: resume}}
  - {at: 60s,  target: ssh, do: {login: down}}
  - {at: 90s,  target: ssh, do: {login: up}}
  - {at: 110s, target: ssh, do: {login: reject_auth}}
  - {at: 140s, target: ssh, do: {login: accept_auth}}
  - {at: 160s, target: ssh, do: {login: rotate_host_key}}
  - {at: 190s, target: ssh, do: {login: restore_host_key}}
  - {at: 210s, target: ssh, do: {login: limit, max_startups: 1}}
  - {at: 240s, target: ssh, do: {login: unlimit}}
  - {at: 260s, target: ssh, do: {nodes: [cn001], sshd: down}}
  - {at: 290s, target: ssh, do: {nodes: [cn001], sshd: up}}
