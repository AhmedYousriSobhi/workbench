name: k8s-node-notready
ref: SC-14
description: A Kubernetes GPU node reports NotReady (KubeletNotReady), then recovers; the client should alert
steps:
  - {at: 0s,   target: k8s, do: {down: [kgpu001]}}
  - {at: 120s, target: k8s, do: {up: [kgpu001]}}
expect:
  - k8s.node_ready: {node: kgpu001, ready: false, within: 90s}
