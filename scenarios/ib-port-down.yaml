name: ib-port-down
ref: SC-07
description: An InfiniBand port goes down on a GPU node and the NIC of another flaps (fault model ib-port-down, nic-flap); the health check drains the node and a ticket opens, then both recover
steps:
  - {at: 0s,  target: fault, do: {inject: ib-port-down, nodes: [first gpu node]}}
  - {at: 45s, target: fault, do: {inject: nic-flap, nodes: [second gpu node]}}
  - {at: 2m,  target: fault, do: {clear: ib-port-down, nodes: [first gpu node]}}
  - {at: 2m,  target: fault, do: {clear: nic-flap, nodes: [second gpu node]}}
expect:
  - slurm.node_state: {node: first gpu node, state: drain, within: 90s}
  - jira.issue_created: {labels: [fault-ib, "node-{first gpu node}"], within: 30s}
