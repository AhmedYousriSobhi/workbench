name: drain-ticket
ref: SC-04
description: A node drains in Slurm and gets a ticket naming the cluster and the node; resuming it resolves the ticket
steps:
  - {at: 0s,  target: slurm, do: {drain: [third cpu node], reason: "scenario: failing disk"}}
  - {at: 5s,  target: jira,  do: {tickets: {action: create, project: OPS, summary: "{third cpu node} drained: failing disk", labels: [workbench, third cpu node, node-drain], priority: High, description: "Slurm drained {third cpu node} (reason: failing disk). Opened by the drain-ticket scenario."}}}
  - {at: 20s, target: jira,  do: {tickets: {action: transition, jql: 'labels = {third cpu node} AND labels = node-drain AND statusCategory != Done', to: In Progress}}}
  - {at: 35s, target: jira,  do: {tickets: {action: comment, jql: 'labels = {third cpu node} AND labels = node-drain AND statusCategory != Done', body: "Disk replaced; returning the node to service."}}}
  - {at: 45s, target: slurm, do: {resume: [third cpu node]}}
  - {at: 50s, target: jira,  do: {tickets: {action: transition, jql: 'labels = {third cpu node} AND labels = node-drain AND statusCategory != Done', to: Resolved, resolution: Done}}}
expect:
  - slurm.node_state: {node: third cpu node, state: drain, within: 20s}
  - jira.issue_status: {jql: 'labels = {third cpu node} AND labels = node-drain', status: Resolved, within: 60s}
