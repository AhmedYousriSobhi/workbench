name: k8s-drain-blocked
ref: SC-39
description: A node is drained while it holds a pod of a deployment whose disruption budget allows no eviction; the drain blocks and the pod stays
steps:
  - {at: 0s,   target: k8s, do: {drain: {node: first k8s gpu node, timeout: 30}}}
  - {at: 100s, target: k8s, do: {uncordon: [first k8s gpu node]}}
expect:
  - k8s.pods_on_node: {node: first k8s gpu node, namespace: team-a, selector: app=inference, min: 1, within: 20s}
