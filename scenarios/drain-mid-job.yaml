name: drain-mid-job
ref: SC-03
description: A node is drained under a running job; the job should finish while the node shows draining, then drained after it ends (run with --trace)
steps:
  - {at: 0s,  target: slurm, do: {submit: {node: first cpu node, duration: 40}}}
  - {at: 15s, target: slurm, do: {drain: [first cpu node], reason: "scenario drain-mid-job"}}
  - {at: 70s, target: slurm, do: {resume: [first cpu node]}}
expect:
  - slurm.node_state: {node: first cpu node, state: drain, within: 20s}
