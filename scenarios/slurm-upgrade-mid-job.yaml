name: slurm-upgrade-mid-job
ref: SC-44
description: "Slurm is upgraded in place while a real job runs, in SchedMD's order (slurmdbd, slurmctld, slurmd, login); the job and its slurmstepd must survive. Start the cluster on an older release first: benchctl up --with accounting --slurm-version 25.11.9 (run with --trace)"
steps:
  - {at: 0s,   target: slurm, do: {submit: {node: first cpu node, duration: 600}}}
  - {at: 15s,  target: slurm-upgrade, do: {to: 26.05.5, daemons: [slurmdbd]}}
  - {at: 45s,  target: slurm-upgrade, do: {to: 26.05.5, daemons: [slurmctld, slurmrestd]}}
  - {at: 75s,  target: slurm-upgrade, do: {to: 26.05.5, daemons: [first cpu node, second cpu node, third cpu node, fourth cpu node, first gpu node, second gpu node]}}
  - {at: 105s, target: slurm-upgrade, do: {to: 26.05.5, daemons: [login]}}
  - {at: 120s, target: slurm, do: {cancel: true}}
expect:
  - slurm.job_state: {node: first cpu node, state: RUNNING, within: 14s}             # before the first upgrade: the job is up
  - slurm.job_state: {node: first cpu node, state: RUNNING, after: 110s, within: 8s} # after the last upgrade (login at 105 s), before the cancel at 120 s
  - slurm.stepd: {node: first cpu node, alive: true, after: 110s, within: 8s}
