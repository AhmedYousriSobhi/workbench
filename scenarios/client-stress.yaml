name: client-stress
ref: SC-01
description: "Five minutes of everything at once for a monitoring client: job floods, GPU errors on both GPU nodes, a rising temperature, a node that loses power, drains, a ticket wave and Jira refusing then slow, then all clear. Run it while the client is open and measure it (benchctl measure app --match NAME --duration 330)"
steps:
  - {at: 0s,   target: slurm,        do: {submit: {node: first cpu node, duration: 120}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: second cpu node, duration: 120}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: third cpu node, duration: 120}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: first gpu node, duration: 150}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: second gpu node, duration: 150}}}
  - {at: 10s,  target: jira,         do: {tickets: {action: create, project: OPS, count: 12, summary: "Stress {n}: job failed on {second cpu node}", labels: [workbench, stress, second cpu node], priority: Medium}}}
  - {at: 20s,  target: gpu-exporter, do: {nodes: [first gpu node, second gpu node], xid: 79}}
  - {at: 30s,  target: bmc-farm,     do: {nodes: [first gpu node, second gpu node], fan_fail: 2}}
  - {at: 40s,  target: bmc-farm,     do: {nodes: [first gpu node], ramp: {to: 92, over: 90s}}}
  - {at: 60s,  target: slurm,        do: {drain: [first gpu node], reason: "stress xid 79"}}
  - {at: 70s,  target: bmc-farm,     do: {nodes: [fourth cpu node], power: "Off"}}
  - {at: 70s,  target: bcm-mock,     do: {nodes: [fourth cpu node], state: DOWN}}
  - {at: 75s,  target: slurm,        do: {drain: [fourth cpu node], reason: "stress node down"}}
  - {at: 100s, target: jira,         do: {failure: {mode: "429", count: 6}}}
  - {at: 130s, target: jira,         do: {failure: {mode: "slow", count: 8, delay: 3}}}
  - {at: 160s, target: jira,         do: {failure: {mode: "503", count: 6}}}
  - {at: 190s, target: jira,         do: {failure: {mode: null}}}
  - {at: 190s, target: jira,         do: {tickets: {action: transition, jql: 'labels = stress', to: In Progress}}}
  - {at: 220s, target: slurm,        do: {submit: {node: first cpu node, duration: 60}}}
  - {at: 220s, target: slurm,        do: {submit: {node: second cpu node, duration: 60}}}
  - {at: 270s, target: gpu-exporter, do: {nodes: [first gpu node, second gpu node], clear: true}}
  - {at: 270s, target: bmc-farm,     do: {nodes: [first gpu node, second gpu node, fourth cpu node], clear: true}}
  - {at: 270s, target: bcm-mock,     do: {nodes: [fourth cpu node], state: UP}}
  - {at: 270s, target: slurm,        do: {resume: [first gpu node, fourth cpu node]}}
expect:
  - jira.issue_count: {jql: 'labels = stress', count: 12, within: 280s}
