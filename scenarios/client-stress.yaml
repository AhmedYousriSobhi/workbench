name: client-stress
ref: SC-01
description: "Five minutes of everything at once for a monitoring client: job floods, GPU errors on both GPU nodes, a rising temperature, a node that loses power, drains, a ticket wave and Jira refusing then slow, then all clear. Run it while the client is open and measure it (benchctl measure app --match NAME --duration 330)"
steps:
  - {at: 0s,   target: slurm,        do: {submit: {node: cn001, duration: 120}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: cn002, duration: 120}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: cn003, duration: 120}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: gpu001, duration: 150}}}
  - {at: 0s,   target: slurm,        do: {submit: {node: gpu002, duration: 150}}}
  - {at: 10s,  target: jira,         do: {tickets: {action: create, project: OPS, count: 12, summary: "Stress {n}: job failed on cn002", labels: [workbench, stress, cn002], priority: Medium}}}
  - {at: 20s,  target: gpu-exporter, do: {nodes: [gpu001, gpu002], xid: 79}}
  - {at: 30s,  target: bmc-farm,     do: {nodes: [gpu001, gpu002], fan_fail: 2}}
  - {at: 40s,  target: bmc-farm,     do: {nodes: [gpu001], ramp: {to: 92, over: 90s}}}
  - {at: 60s,  target: slurm,        do: {drain: [gpu001], reason: "stress xid 79"}}
  - {at: 70s,  target: bmc-farm,     do: {nodes: [cn004], power: "Off"}}
  - {at: 70s,  target: bcm-mock,     do: {nodes: [cn004], state: DOWN}}
  - {at: 75s,  target: slurm,        do: {drain: [cn004], reason: "stress node down"}}
  - {at: 100s, target: jira,         do: {failure: {mode: "429", count: 6}}}
  - {at: 130s, target: jira,         do: {failure: {mode: "slow", count: 8, delay: 3}}}
  - {at: 160s, target: jira,         do: {failure: {mode: "503", count: 6}}}
  - {at: 190s, target: jira,         do: {failure: {mode: null}}}
  - {at: 190s, target: jira,         do: {tickets: {action: transition, jql: 'labels = stress', to: In Progress}}}
  - {at: 220s, target: slurm,        do: {submit: {node: cn001, duration: 60}}}
  - {at: 220s, target: slurm,        do: {submit: {node: cn002, duration: 60}}}
  - {at: 270s, target: gpu-exporter, do: {nodes: [gpu001, gpu002], clear: true}}
  - {at: 270s, target: bmc-farm,     do: {nodes: [gpu001, gpu002, cn004], clear: true}}
  - {at: 270s, target: bcm-mock,     do: {nodes: [cn004], state: UP}}
  - {at: 270s, target: slurm,        do: {resume: [gpu001, cn004]}}
expect:
  - jira.issue_count: {jql: 'labels = stress', count: 12, within: 280s}
