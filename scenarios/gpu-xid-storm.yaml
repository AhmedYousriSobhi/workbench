name: gpu-xid-storm
ref: SC-06
description: "The GPUs of both GPU nodes fall off the bus (XID 79 in DCGM and nvidia-smi, a critical BMC event). Only the cause is injected (fault model, ADR 0006): the node health check drains each node and a ticket is filed, and the scenario asserts both. Recovery is injected too; NHC resumes the nodes it drained. The app should open tickets of its own. The client reads only four GPU series and has no XID handling: it sees the drain reason and the BMC event text."
steps:
  - {at: 0s, target: fault, do: {inject: gpu-fell-off-bus, nodes: [first gpu node, second gpu node]}}
  - {at: 3m, target: fault, do: {clear: gpu-fell-off-bus, nodes: [first gpu node, second gpu node]}}
expect:
  - slurm.node_state: {node: first gpu node, state: drain, within: 2m}   # NHC drains it (HealthCheckInterval 30 s)
  - slurm.node_state: {node: second gpu node, state: drain, within: 2m}
  - jira.issue_created: {labels: [fault-xid, "node-{first gpu node}"], within: 2m}   # the fault side effect and node_watch file it
