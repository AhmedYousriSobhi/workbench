name: slurmd-disabled-mid-job
ref: SC-20
description: slurmd stays down for 45 s under a running job (slurmctld marks the node not responding), then is started again; see what the job does (run with --trace)
steps:
  - {at: 0s,  target: slurm, do: {submit: {node: first cpu node, duration: 600}}}
  - {at: 15s, target: slurm, do: {slurmd_stop: [first cpu node]}}
  - {at: 60s, target: slurm, do: {slurmd_start: [first cpu node]}}
  - {at: 100s, target: slurm, do: {cancel: true}}
expect:
  - slurm.job_state: {node: first cpu node, state: RUNNING, within: 14s}
