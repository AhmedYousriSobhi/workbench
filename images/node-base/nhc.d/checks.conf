# NHC checks, run top to bottom by images/node-base/nhc. One line per check: NAME on|off [key=value ...]
# NAME is the file NAME.sh in this directory. Manage it with `benchctl add|set|remove check`, or edit it and run
# `benchctl reload checks` (docs/guides/nhc-checks.md).
gpu-count on
gpu-xid on
ib-ports on
nic-flap on
