# Default alert rules (issue 633, ADR 0066 addendum). Small on purpose: they give `benchctl get alerts` and
# `benchctl wait alert` something to read and the gpu-fault-to-alert recipe an end-to-end assert.
# The app under test keeps its own alerting; these only watch the simulated GPU exporter.
groups:
  - name: workbench-default
    interval: 15s
    rules:
      - alert: GpuXid
        expr: max by (node) (DCGM_FI_DEV_XID_ERRORS) > 0
        for: 15s
        labels: {severity: page}
        annotations: {summary: "XID error {{ $value }} on {{ $labels.node }}"}
      # Reads the GPU exporter's temperature. A scenario's BMC `temp` step does not change it; a gpu-exporter `temp` step does.
      - alert: GpuOverheat
        expr: max by (node) (DCGM_FI_DEV_GPU_TEMP) > 85
        for: 15s
        labels: {severity: warning}
        annotations: {summary: "GPU on {{ $labels.node }} at {{ $value }} C"}
      # A powered-off node publishes nothing, so its series vanish: a node seen 3 minutes ago and not now.
      # It resolves by itself once the 3 minutes have passed; read it while the node is down.
      - alert: NodeDown
        expr: count by (node) (DCGM_FI_DEV_GPU_TEMP offset 3m) unless count by (node) (DCGM_FI_DEV_GPU_TEMP)
        labels: {severity: page}
        annotations: {summary: "{{ $labels.node }} stopped publishing metrics"}
