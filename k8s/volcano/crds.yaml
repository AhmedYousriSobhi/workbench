                  x-kubernetes-int-or-string: true
                description: |-
                  MinResources defines the minimal resource of members/tasks to run the pod group;
                  if there's not enough resources to start all tasks, the scheduler
                  will not start anyone.
                type: object
              minTaskMember:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  MinTaskMember defines the minimal number of pods to run for each task in the pod group;
                  if there's not enough resources to start each task, the scheduler
                  will not start anyone.
                  SubGroupPolicy covers all capabilities of minTaskMember, while providing richer network topology and Gang scheduling management capabilities.
                  Recommend using SubGroupPolicy to uniformly manage Gang scheduling for each Task group.
                type: object
              networkTopology:
                description: NetworkTopology defines the NetworkTopology config, this
                  field works in conjunction with network topology feature and hyperNode
                  CRD.
                properties:
                  highestTierAllowed:
                    description: HighestTierAllowed specifies the highest tier that
                      a job allowed to cross when scheduling.
                    minimum: 0
                    type: integer
                  highestTierName:
                    description: |-
                      HighestTierName specifies the highest tier name that a job allowed to cross when scheduling.
                      HighestTierName and HighestTierAllowed cannot be set simultaneously.
                    maxLength: 253
                    type: string
                  mode:
                    default: hard
                    description: Mode specifies the mode of the network topology constrain.
                    enum:
                    - hard
                    - soft
                    type: string
                type: object
              priorityClassName:
                description: |-
                  If specified, indicates the PodGroup's priority. "system-node-critical" and
                  "system-cluster-critical" are two special keywords which indicate the
                  highest priorities with the former being the highest priority. Any other
                  name must be defined by creating a PriorityClass object with that name.
