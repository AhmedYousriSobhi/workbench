# Ported from the earlier Kubernetes lab bin/fixtures.sh. GPUs are fake: see apply.sh for the capacity patch.
apiVersion: v1
kind: Pod
metadata: {name: gpu-train, namespace: team-a, annotations: {kwok.x-k8s.io/usage-cpu: "6", kwok.x-k8s.io/usage-memory: 48Gi}}  # what metrics-server reports (issue 382)
spec:
  containers: [{name: c, image: "rancher/mirrored-pause:3.6", resources: {limits: {nvidia.com/gpu: "2"}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: gpu-waiting, namespace: team-b}
spec:
  containers: [{name: c, image: "rancher/mirrored-pause:3.6", resources: {limits: {nvidia.com/gpu: "9"}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: badimage, namespace: team-b, labels: {workbench_fault: imagepull}}
spec:
  containers: [{name: c, image: "example.invalid/none:1"}]
---
apiVersion: v1
kind: Pod
metadata: {name: crashloop, namespace: team-b, labels: {workbench_fault: crashloop}}
spec:
  containers: [{name: c, image: "rancher/mirrored-library-busybox:1.36.1", command: ["sh","-c","echo failing; exit 1"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: oom, namespace: team-b, labels: {workbench_fault: oom}}
spec:
  containers:
  - name: c
    image: rancher/mirrored-library-busybox:1.36.1
    command: ["sh","-c","x=$(head -c 30000000 /dev/zero | tr '\\0' a); sleep 600"]
    resources: {limits: {memory: 10Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: team-a}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}, annotations: {kwok.x-k8s.io/usage-cpu: 120m, kwok.x-k8s.io/usage-memory: 180Mi}}
    spec:
      containers: [{name: c, image: "rancher/mirrored-pause:3.6"}]
