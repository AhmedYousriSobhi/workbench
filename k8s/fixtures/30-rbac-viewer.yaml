# "Limited user": may only get/list pods and events in team-a.
apiVersion: v1
kind: ServiceAccount
metadata: {name: viewer, namespace: team-a}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pods-read, namespace: team-a}
rules: [{apiGroups: [""], resources: [pods, events], verbs: [get, list]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: viewer-pods, namespace: team-a}
subjects: [{kind: ServiceAccount, name: viewer, namespace: team-a}]
roleRef: {kind: Role, name: pods-read, apiGroup: rbac.authorization.k8s.io}
