# The user the web page counts API requests with: it may read /metrics (what Prometheus does) and nothing else.
# Kept apart from `viewer`, which is what a monitoring client is given.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: workbench-metrics}
rules:
- {nonResourceURLs: [/metrics], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: workbench-metrics}
subjects: [{kind: User, name: metrics}]
roleRef: {kind: ClusterRole, name: workbench-metrics, apiGroup: rbac.authorization.k8s.io}
