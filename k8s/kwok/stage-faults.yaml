# workbench fault stages: a pod labelled workbench_fault=<kind> is given the status a real kubelet would report.
# KWOK has no kubelet, so without these every pod would simply be Running (docs/adr/0034). Applied by benchctl/k8s.py.
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: fault-crashloop
spec:
  weight: 10
  next:
    statusTemplate: |
      {{ $now := Now }}
      {{ $podIPs := PodIPsWith .spec.nodeName ( or .spec.hostNetwork false ) ( or .metadata.uid "" ) ( or .metadata.name "" ) ( or .metadata.namespace "" ) }}
      {{ with $podIPs }}
      podIP: {{ index . 0 | Quote }}
      podIPs:
      {{ range . }}
      - ip: {{ . | Quote }}
      {{ end }}
      {{ end }}
      phase: Running
      startTime: {{ $now | Quote }}
      conditions:
      - {lastTransitionTime: {{ $now | Quote }}, status: "True", type: Initialized}
      - {lastTransitionTime: {{ $now | Quote }}, status: "False", type: Ready, reason: ContainersNotReady}
      - {lastTransitionTime: {{ $now | Quote }}, status: "False", type: ContainersReady, reason: ContainersNotReady}
      containerStatuses:
      {{ range .spec.containers }}
      - image: {{ .image | Quote }}
        name: {{ .name | Quote }}
        ready: false
        started: false
        restartCount: 7
        state:
          waiting: {reason: CrashLoopBackOff, message: "back-off 5m0s restarting failed container"}
        lastState:
          terminated: {exitCode: 1, reason: Error, startedAt: {{ $now | Quote }}, finishedAt: {{ $now | Quote }}}
      {{ end }}
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchLabels:
      workbench_fault: crashloop
    matchExpressions:
    - key: .metadata.deletionTimestamp
      operator: DoesNotExist
    - key: .status.phase
      operator: In
      values:
      - Pending
    - key: .status.containerStatuses
      operator: DoesNotExist
