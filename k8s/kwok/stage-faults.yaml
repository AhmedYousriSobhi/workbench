apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: fault-node-down
spec:
  weight: 10
  next:
    statusTemplate: |
      {{ $now := Now }}
      {{ $since := or .metadata.creationTimestamp $now }}
      conditions:
      - {lastHeartbeatTime: {{ $now | Quote }}, lastTransitionTime: {{ $now | Quote }}, status: "False", type: Ready, reason: KubeletNotReady, message: "container runtime is down"}
      - {lastHeartbeatTime: {{ $now | Quote }}, lastTransitionTime: {{ $since | Quote }}, status: "False", type: MemoryPressure, reason: KubeletHasSufficientMemory, message: "kubelet has sufficient memory available"}
      - {lastHeartbeatTime: {{ $now | Quote }}, lastTransitionTime: {{ $since | Quote }}, status: "False", type: DiskPressure, reason: KubeletHasNoDiskPressure, message: "kubelet has no disk pressure"}
      - {lastHeartbeatTime: {{ $now | Quote }}, lastTransitionTime: {{ $since | Quote }}, status: "False", type: PIDPressure, reason: KubeletHasSufficientPID, message: "kubelet has sufficient PID available"}
  resourceRef:
    apiGroup: v1
    kind: Node
  selector:
    matchLabels:
      workbench_fault: down
    matchExpressions:
    - key: .status.conditions.[] | select( .type == "Ready" ) | .status
      operator: In
      values:
      - "True"
