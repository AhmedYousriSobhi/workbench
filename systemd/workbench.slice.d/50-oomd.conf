# systemd-oomd backstop for the workbench containers (SPEC GV-10, ADR 0010 addendum). Optional: installed only by
#   sudo ./scripts/install-governor.sh --with-oomd
# Docker puts every container in workbench-pN.slice (compose cgroup_parent), and systemd nests those under
# workbench.slice, so this one drop-in covers all priority classes and nothing else on the host.
# It never touches /etc/systemd/oomd.conf. systemd-oomd must be running for it to act (benchctl doctor says).
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
