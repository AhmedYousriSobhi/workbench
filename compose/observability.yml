# Core observability (priority P1). Data directories live on capped tmpfs: sim state is disposable.
services:
  prometheus:
    networks:
      default:
        ipv4_address: 10.141.255.20  # benchctl/addressing.py SERVICE_HOSTS
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=150MB  # under the 200m tmpfs below: the oldest blocks go before the tmpfs fills and the 300m cap is hit (issue 455)
      - --storage.tsdb.path=/prometheus
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules.yml:/etc/prometheus/rules.yml:ro
      - ../observability/targets:/etc/prometheus/targets:ro
    tmpfs: ["/prometheus:size=200m,uid=65534,gid=65534"]
    mem_limit: 300m
    ports: ["127.0.0.1:9090:9090"]
    cgroup_parent: workbench-p1.slice
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    networks:
      default:
        ipv4_address: 10.141.255.21  # benchctl/addressing.py SERVICE_HOSTS
    image: grafana/grafana-oss:11.1.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 300m
    ports: ["127.0.0.1:3000:3000"]
    cgroup_parent: workbench-p1.slice
    depends_on: [prometheus]
  gpu-exporter-farm:
    networks:
      default:
        ipv4_address: 10.141.255.22  # benchctl/addressing.py SERVICE_HOSTS
    image: workbench/gpu-exporter-farm
    build: ../components/gpu-exporter-farm  # pyyaml is baked in (issue 235); `benchctl up` passes --build
    volumes:
      - ./generated/inventory.json:/inventory.json:ro
      - ./generated/dcgm:/dcgm  # the real exporter's override file, written only when the dcgm part is on (issue 426)
    environment:
      DCGM_OVERRIDES: /dcgm
    ports: ["127.0.0.1:9400:9400"]  # scenario engine injects faults here
    mem_limit: 100m
    cgroup_parent: workbench-p2.slice
