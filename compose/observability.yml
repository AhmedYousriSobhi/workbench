# Core observability (priority P1). Data directories live on capped tmpfs: sim state is disposable.
services:
  prometheus:
    networks:
      default:
        ipv4_address: 10.141.255.20  # benchctl/addressing.py SERVICE_HOSTS
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.path=/prometheus
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/targets:/etc/prometheus/targets:ro
    tmpfs: ["/prometheus:size=200m,uid=65534,gid=65534"]
    mem_limit: 300m
    ports: ["127.0.0.1:9090:9090"]
    cgroup_parent: workbench-p1.slice
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    networks:
      default:
        ipv4_address: 10.141.255.21  # benchctl/addressing.py SERVICE_HOSTS
    image: grafana/grafana-oss:11.1.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 300m
    ports: ["127.0.0.1:3000:3000"]
    cgroup_parent: workbench-p1.slice
    depends_on: [prometheus]
  gpu-exporter-farm:
    networks:
      default:
        ipv4_address: 10.141.255.22  # benchctl/addressing.py SERVICE_HOSTS
    image: python:3.12-slim
    command: sh -c "pip install -q pyyaml && python /app/exporter.py /sim.yaml 9400"
    volumes:
      - ../components/gpu-exporter-farm/exporter.py:/app/exporter.py:ro
      - ./generated/sim.yaml:/sim.yaml:ro
    ports: ["127.0.0.1:9400:9400"]  # scenario engine injects faults here
    mem_limit: 100m
    cgroup_parent: workbench-p2.slice
