# Single source of truth for workbench. All generated artifacts derive from this file.
time_dilation: 1.0        # >1 compresses job durations and arrival intervals

jira:
  mode: mock              # mock | cloud | dc

compute:
  count: 4
  prefix: cn
  memory_mb: 4096         # fake RealMemory per node
  cpus: 8

gpu:
  nodes: 2
  prefix: gpu
  gpus_per_node: 8
  type: h200
  cpus: 64                # per GPU node, 8 per GPU: the same in Slurm, Redfish and BCM (issue 462)
  memory_mb: 16384        # fake RealMemory per GPU node, 2048 per GPU
  # mig:                  # optional, off by default (issue 546, ADR 0075): split every GPU of the listed nodes into slices;
  #   nodes: [gpu002]     #   Slurm then advertises gpu:h200_1g:56 there (8 GPUs x 7) and jobs ask --gres=gpu:h200_1g:N
  #   profile: 1g
  #   slices: 7           #   per GPU, 1 to 7

partitions:
  - {name: cpu, nodes: compute}
  - {name: gpu, nodes: gpu}

# topology:             # optional real Slurm topology (topology.conf, issue 543, docs/guides/topology.md); nodes are spread round-robin over the leaves
#   plugin: tree        # tree | block
#   spines: 1
#   leaves_per_spine: 2

# qos:                  # optional real QOS, priority and preemption (issue 544, docs/guides/qos-and-preemption.md); needs the accounting part
#   - {name: scavenger, priority: 1, max_gpus_per_user: 2}
#   - {name: urgent, priority: 1000, preempt: [scavenger], grace_time_s: 30}
# slurm:
#   priority: {weight_qos: 1000, weight_age: 100, weight_fairshare: 10000, decay_half_life: 7-0}

controller:             # a controller node (SPEC C-20, issue 416): slurmctld's host with sshd, the BCM head node (cmsh); off: the login node acts as the head node
  enabled: false        # benchctl up --controller
  allow:                # who may ssh in: these users, and every user in one of these groups
    users: []
    groups: [admins]

users:
  - {name: alice, persona: ml-trainer, qos: normal, groups: [admins]}
  - {name: bob, persona: mpi-researcher, qos: normal}

kubernetes:             # the optional Kubernetes part (benchctl up --with k8s, ADR 0034): a real control plane, KWOK nodes
  version: v1.36.1      # control-plane images and kubectl
  nodes:                # separate from the Slurm nodes (a heterogeneous cluster); --k8s-nodes N sets the GPU group's count
    - {prefix: kcn,  count: 2, cpus: 64,  memory_gb: 256,  pool: cpu}
    - {prefix: kgpu, count: 2, cpus: 128, memory_gb: 1024, pool: gpu, gpus: 8, gpu_type: h200}

login:                  # login nodes, one auth mode each: ssh | teleport | both (ADR 0023); the first is `login`, then login2, ...
  - ssh                 # benchctl up --login ssh,teleport overrides this; a teleport/both node turns the Teleport part on

teleport:               # the optional Teleport part (benchctl up --with teleport, ADR 0020)
  version: 18.11.8      # Community Edition tag; the server must not be older than your tsh major
  cert_ttl: 12h         # user certificate lifetime (max_session_ttl of the role)

bcm:
  manage_kubernetes: true   # BCM lists the Kubernetes nodes (categories k8s-cpu, k8s-gpu); false = BCM does not manage the Kubernetes cluster (--no-bcm-k8s, issue 413)

bmc:
  per_node: true   # one BMC address per node (ADR 0018); a workbench selection can limit which nodes (--bmc-nodes)

# storage:               # declared mounts and a shared scratch (issue 461, ADR 0078, docs/guides/storage.md); without it /home (NFS) and /scratch (Lustre, shared) apply
#   mounts:
#     - {path: /scratch, kind: lustre, size_tb: 500, used_pct: 40, shared: true}
#     - {path: /datasets, kind: ddn, size_tb: 2000, shared: true, host_path: /mnt/bigdisk/datasets}   # users' training data on a disk you name

host:
  reserve_gb: 3
  safety_floor_gb: 1
