[project]
name = "workbench"
version = "0.11.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0 OR MIT"}
# Every dependency is an exact pin (issue 855): raise one on purpose, in its own PR. tests/test_docs.py fails on a loose one.
dependencies = ["typer==0.27.3", "pyyaml==6.0.3", "starlette==1.10.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "coverage==7.17.1", "jsonschema==4.26.0"]  # jsonschema: tests only (ADR 0062)
mcp = ["mcp==2.3.0"]  # `benchctl serve mcp` only (ADR 0064): pulls in pydantic, never imported by the web page, the governor or plain benchctl
browser = ["playwright==1.64.1", "pillow==13.0.0"]  # UI screenshots/checks: then `playwright install chromium`

[project.scripts]
benchctl = "benchctl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchctl", "governor", "webui"]

[tool.setuptools.package-data]
webui = ["static/*", "static/js/*", "static/fonts/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "live: needs Docker or a live stack (every test under tests/real; set WORKBENCH_REAL=1)",
  "browser: runs headless Chromium (playwright); leave out with verify.sh --skip-browser",
]
