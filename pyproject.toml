[project]
name = "workbench"
version = "0.0.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0 OR MIT"}
dependencies = ["typer", "pyyaml", "starlette", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "coverage"]
browser = ["playwright"]  # UI screenshots/checks: then `playwright install chromium`

[project.scripts]
benchctl = "benchctl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchctl", "governor", "webui"]

[tool.setuptools.package-data]
webui = ["static/*"]

[tool.ruff]
line-length = 100
