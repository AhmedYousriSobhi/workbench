[project]
name = "opti-sim"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["typer", "pyyaml", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "coverage"]
browser = ["playwright"]  # UI screenshots/checks: then `playwright install chromium`

[project.scripts]
simctl = "simctl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simctl", "governor", "webui"]

[tool.setuptools.package-data]
webui = ["static/*"]

[tool.ruff]
line-length = 100
