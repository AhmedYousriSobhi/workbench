[project]
name = "workbench"
version = "0.8.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0 OR MIT"}
dependencies = ["typer", "pyyaml", "starlette", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "coverage"]
browser = ["playwright", "pillow"]  # UI screenshots/checks: then `playwright install chromium`

[project.scripts]
benchctl = "benchctl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["benchctl", "governor", "webui"]

[tool.setuptools.package-data]
webui = ["static/*", "static/js/*", "static/fonts/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "live: needs Docker or a live stack (every test under tests/real; set WORKBENCH_REAL=1)",
  "browser: runs headless Chromium (playwright); leave out with verify.sh --skip-browser",
]
